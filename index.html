<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Küchenkartei</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Literata:opsz,wght@7..72,400;7..72,600&family=Schibsted+Grotesk:wght@400;600;700&display=swap">
<style id="kk-css">
/* Layout: gedrucktes Kochbuch — Titelseite mit Inhaltsverzeichnis, Kapitel-Aufschlagseiten, Rezept als Doppelseite (Zutaten links, Zubereitung rechts); Kapitelfarben als Daumenregister am rechten Rand. Die Küche (Editor) nutzt dieselben Tokens, nüchtern. */
:root {
  --paper: #FBFBF9;
  --sheet: #FFFFFF;
  --ink: #1E1D1B;
  --muted: #69665F;
  --rule: #E3E1DB;
  --rule-strong: #BDB9B0;
  --soft: #F2F1EC;
  --ch: #1F5E7A;
  --ch-text: var(--ch);
  --ok: #2F6B3F;
  --ok-soft: #E1EEE3;
  --warn: #8A5A00;
  --warn-soft: #F6EBCF;
  --danger: #A3322A;
  --danger-soft: #F7E0DD;
  --f-display: "Instrument Serif", "Iowan Old Style", Georgia, serif;
  --f-text: "Literata", Georgia, "Times New Roman", serif;
  --f-ui: "Schibsted Grotesk", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --shadow: 0 1px 2px rgba(30, 29, 27, .05), 0 8px 24px rgba(30, 29, 27, .06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #151514; --sheet: #1C1C1A; --ink: #ECEAE4; --muted: #A29F97; --rule: #33322E; --rule-strong: #57554F; --soft: #23221F;
    --ch-text: color-mix(in oklab, var(--ch) 50%, white);
    --ok: #8CC79B; --ok-soft: #1F3324; --warn: #E3B354; --warn-soft: #3A2F16; --danger: #EE8F85; --danger-soft: #3D201D;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #151514; --sheet: #1C1C1A; --ink: #ECEAE4; --muted: #A29F97; --rule: #33322E; --rule-strong: #57554F; --soft: #23221F;
  --ch-text: color-mix(in oklab, var(--ch) 50%, white);
  --ok: #8CC79B; --ok-soft: #1F3324; --warn: #E3B354; --warn-soft: #3A2F16; --danger: #EE8F85; --danger-soft: #3D201D;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.3);
  color-scheme: dark;
}
* { box-sizing: border-box; --ch-text: var(--ch); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) * { --ch-text: color-mix(in oklab, var(--ch) 50%, white); } }
:root[data-theme="dark"] * { --ch-text: color-mix(in oklab, var(--ch) 50%, white); }
body { background: var(--paper); color: var(--ink); font-family: var(--f-ui); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 400; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--ch-text); outline-offset: 2px; }
.wrap { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.eyebrow { font-family: var(--f-ui); font-size: 12px; text-transform: uppercase; letter-spacing: .14em; font-weight: 700; color: var(--muted); }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }

/* Kopfzeile */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--paper); border-bottom: 1px solid var(--rule); }
.top .wrap { display: flex; align-items: center; gap: 6px; padding-block: 10px; }
.mark { font-family: var(--f-display); font-size: 25px; text-decoration: none; margin-right: auto; line-height: 1.1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav a { text-decoration: none; padding: 7px 10px; border-radius: 6px; font-weight: 600; font-size: 14px; white-space: nowrap; }
.nav a:hover, .nav a[aria-current="page"] { background: var(--soft); }
.nav .count { font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 400; }

main { padding-block: 28px 80px; min-height: 60vh; }

/* Knöpfe & Felder */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--rule-strong); background: var(--sheet); color: var(--ink); padding: 8px 14px; border-radius: 7px; cursor: pointer; font-weight: 600; font-size: 14px; text-decoration: none; line-height: 1.25; }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.btn.go { background: var(--ok); border-color: var(--ok); color: var(--sheet); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--soft); }
.btn.danger { color: var(--danger); }
.btn.danger.solid { background: var(--danger); border-color: var(--danger); color: var(--sheet); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.small { padding: 5px 10px; font-size: 13px; }
.inp { background: var(--sheet); border: 1px solid var(--rule-strong); border-radius: 7px; padding: 9px 11px; width: 100%; min-width: 0; }
.inp:focus { border-color: var(--ink); outline: none; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--rule-strong); background: var(--sheet); padding: 5px 12px; border-radius: 999px; font-size: 13px; cursor: pointer; font-weight: 600; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.tag { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--soft); color: var(--muted); font-weight: 600; }
.tag.diet { background: var(--ok-soft); color: var(--ok); }
.tag.example { background: var(--warn-soft); color: var(--warn); }
.note { padding: 10px 14px; border-radius: 8px; background: var(--warn-soft); font-size: 14px; }
.note.err { background: var(--danger-soft); }
.note.ok { background: var(--ok-soft); }
.spinner { width: 18px; height: 18px; border: 3px solid var(--rule); border-top-color: var(--ink); border-radius: 50%; animation: spin 1s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 8px; font-weight: 600; z-index: 20; max-width: calc(100% - 32px); }
.empty { text-align: center; padding: 56px 16px; display: grid; gap: 12px; justify-items: center; }
.empty h2 { font-family: var(--f-display); font-size: 34px; }
.empty p { max-width: 46ch; margin: 0; color: var(--muted); font-family: var(--f-text); }

/* Titelseite */
.cover { padding-block: 24px 40px; border-bottom: 1px solid var(--rule); display: grid; gap: 14px; }
.booktitle { font-family: var(--f-display); font-size: clamp(56px, 11vw, 132px); line-height: .92; letter-spacing: -.02em; }
.booktitle em { font-style: italic; }
.subtitle { font-family: var(--f-display); font-style: italic; font-size: clamp(22px, 3vw, 30px); color: var(--muted); margin: 0; }
.intro { font-family: var(--f-text); font-size: 17px; max-width: 60ch; margin: 6px 0 0; white-space: pre-line; }
.finder { display: grid; gap: 10px; margin-top: 18px; }
.search { display: flex; align-items: center; gap: 8px; background: var(--sheet); border: 1px solid var(--rule-strong); border-radius: 999px; padding: 0 16px; max-width: 560px; }
.search input { border: 0; background: transparent; padding: 11px 0; width: 100%; outline: none; font-size: 16px; }
.search:focus-within { border-color: var(--ink); }

.toc { padding-top: 34px; }
.toc > h2 { font-family: var(--f-display); font-size: 40px; margin-bottom: 18px; }
.toc-grid { columns: 2 340px; column-gap: 48px; }
.toc-ch { break-inside: avoid; margin-bottom: 26px; }
.toc-ch > a { display: flex; align-items: baseline; gap: 12px; text-decoration: none; border-bottom: 2px solid var(--ch); padding-bottom: 6px; margin-bottom: 6px; }
.toc-ch .no { font-family: var(--f-display); font-size: 30px; color: var(--ch-text); font-variant-numeric: tabular-nums; }
.toc-ch .name { font-weight: 700; font-size: 16px; }
.toc-ch ol { list-style: none; margin: 0; padding: 0; }
.toc-ch li a { display: flex; align-items: baseline; text-decoration: none; padding: 5px 0; font-family: var(--f-text); font-size: 16px; }
.toc-ch li a:hover .t { text-decoration: underline; text-underline-offset: 3px; }
.toc-ch .dots { flex: 1; border-bottom: 1px dotted var(--rule-strong); margin: 0 8px; min-width: 24px; transform: translateY(-4px); }
.toc-ch .m { font-family: var(--f-ui); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* Karten */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 28px 22px; }
.card { display: grid; gap: 8px; text-decoration: none; min-width: 0; align-content: start; }
.card .pic { aspect-ratio: 4 / 3; max-width: 100%; background: var(--soft); border-radius: 4px; overflow: hidden; position: relative; }
.card .pic img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .3s ease; }
.card:hover .pic img { transform: scale(1.03); }
.card .ph { position: absolute; inset: 0; display: grid; place-items: center; background: var(--ch); color: rgba(255,255,255,.9); font-family: var(--f-display); font-size: 64px; }
.card .chap { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ch-text); }
.card h3 { font-family: var(--f-display); font-size: 27px; line-height: 1.05; }
.card .meta { display: flex; gap: 12px; font-size: 13px; color: var(--muted); flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.results-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-top: 30px; margin-bottom: 18px; }
.results-head h2 { font-family: var(--f-display); font-size: 34px; }

/* Kapitel-Aufschlagseite */
.opener { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 24px; align-items: end; padding-bottom: 22px; margin-bottom: 30px; border-bottom: 3px solid var(--ch); }
.opener .big { font-family: var(--f-display); font-size: clamp(90px, 16vw, 180px); line-height: .8; color: var(--ch-text); font-variant-numeric: tabular-nums; }
.opener h1 { font-family: var(--f-display); font-size: clamp(40px, 6vw, 68px); line-height: 1; }

/* Daumenregister */
.register { position: fixed; right: env(safe-area-inset-right, 0px); top: 50%; transform: translateY(-50%); display: none; flex-direction: column; gap: 3px; z-index: 4; }
.register a { writing-mode: vertical-rl; background: var(--ch); color: #fff; text-decoration: none; font-size: 12px; font-weight: 700; letter-spacing: .06em; padding: 12px 7px; border-radius: 6px 0 0 6px; opacity: .78; transition: opacity .15s, padding .15s; max-height: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.register a:hover, .register a[aria-current="true"] { opacity: 1; padding-right: 12px; }
@media (min-width: 1200px) { .register.on { display: flex; } }

/* Rezept */
.recipe .crumb { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--ch-text); text-decoration: none; margin-bottom: 10px; }
.r-head { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, .9fr); gap: 36px; align-items: end; padding-bottom: 28px; border-bottom: 1px solid var(--rule); }
.r-head.nopic { grid-template-columns: minmax(0, 1fr); }
.r-head h1 { font-family: var(--f-display); font-size: clamp(44px, 6.4vw, 84px); line-height: .95; letter-spacing: -.01em; }
.lede { font-family: var(--f-text); font-style: italic; font-size: 19px; color: var(--muted); margin: 14px 0 0; max-width: 52ch; }
.r-photo { margin: 0; aspect-ratio: 4 / 5; max-width: 100%; border-radius: 4px; overflow: hidden; background: var(--soft); }
.r-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.facts { display: flex; flex-wrap: wrap; margin: 22px 0 0; padding: 0; }
.facts div { padding: 4px 18px 4px 0; margin: 0 18px 8px 0; border-right: 1px solid var(--rule); }
.facts div:last-child { border-right: 0; }
.facts dt { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); font-weight: 700; }
.facts dd { margin: 0; font-family: var(--f-display); font-size: 24px; line-height: 1.2; font-variant-numeric: tabular-nums; }
.r-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 14px; }
.r-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 16px; }
.wake { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.r-body { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 48px; padding-top: 30px; align-items: start; }
.r-side { display: grid; gap: 26px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 70px); max-height: calc(100vh - 86px); overflow: auto; padding-right: 4px; }
.r-side h2, .r-method h2, .r-extra h2 { font-family: var(--f-display); font-size: 32px; margin-bottom: 10px; }
.calc { background: var(--soft); border-radius: 8px; padding: 14px; }
.calc .eyebrow { margin-bottom: 8px; display: block; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--paper); border-radius: 7px; padding: 3px; gap: 3px; margin-bottom: 12px; }
.seg button { border: 0; background: transparent; padding: 6px 4px; border-radius: 5px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.stepper { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.stepper button { width: 38px; height: 38px; border-radius: 7px; border: 1px solid var(--rule-strong); background: var(--sheet); font-size: 20px; cursor: pointer; line-height: 1; }
.stepper input { width: 76px; text-align: center; font-size: 18px; font-variant-numeric: tabular-nums; }
.calcrow { display: grid; gap: 6px; }
.calcrow + .calcrow { margin-top: 10px; }
.calcrow .lbl { font-size: 13px; font-weight: 600; }
.pan { display: grid; gap: 6px; padding: 8px 10px; border: 1px solid var(--rule); border-radius: 7px; background: var(--paper); }
.pan + .pan { margin-top: 8px; }
.pan .dims { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.pan .dims input { width: 70px; }
.pan .dims select { width: auto; }
.factor { margin-top: 12px; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-top: 10px; border-top: 1px dashed var(--rule-strong); }
.factor b { font-family: var(--f-display); font-size: 30px; font-weight: 400; font-variant-numeric: tabular-nums; }
.hint { font-size: 12.5px; color: var(--muted); margin: 6px 0 0; }
.ings h3, .r-method h3 { font-family: var(--f-ui); font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--ch-text); margin: 16px 0 4px; font-weight: 700; }
.ings h3:first-child { margin-top: 0; }
.ings ul { list-style: none; margin: 0; padding: 0; }
.ing { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--rule); cursor: pointer; align-items: baseline; font-family: var(--f-text); font-size: 16px; }
.ing:last-child { border-bottom: 0; }
.ing .q { font-family: var(--f-ui); font-variant-numeric: tabular-nums; text-align: right; font-weight: 700; white-space: nowrap; font-size: 15px; }
.ing .q.scaled { color: var(--ch-text); }
.ing small { color: var(--muted); font-style: italic; }
.ing.done { opacity: .4; text-decoration: line-through; }
.r-method ol { list-style: none; margin: 0; padding: 0; counter-reset: s; }
.r-method li { counter-increment: s; display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 14px; padding: 12px 0; cursor: pointer; font-family: var(--f-text); font-size: 18px; line-height: 1.6; max-width: 68ch; border-bottom: 1px solid var(--rule); }
.r-method li::before { content: counter(s); font-family: var(--f-display); font-size: 40px; line-height: .9; color: var(--ch-text); text-align: right; font-variant-numeric: tabular-nums; }
.r-method li.done { opacity: .4; }
.r-method h3 { margin-left: 66px; margin-top: 22px; }
.r-extra { display: grid; gap: 24px; margin-top: 34px; }
.tips { font-family: var(--f-text); font-size: 17px; white-space: pre-wrap; max-width: 68ch; border-left: 3px solid var(--ch); padding: 4px 0 4px 16px; }
.source { font-size: 13px; color: var(--muted); }
.thumbs { display: flex; gap: 10px; flex-wrap: wrap; }
.thumbs a { width: 110px; height: 110px; border-radius: 6px; overflow: hidden; border: 1px solid var(--rule); display: block; }
.thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }
.r-nav { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 48px; padding-top: 18px; border-top: 1px solid var(--rule); }
.r-nav a { text-decoration: none; display: grid; gap: 2px; min-width: 0; }
.r-nav a:last-child { text-align: right; }
.r-nav span { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; font-weight: 700; }
.r-nav b { font-family: var(--f-display); font-weight: 400; font-size: 24px; line-height: 1.1; }
.statusbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 14px; border-radius: 8px; background: var(--soft); margin-bottom: 22px; }
.statusbar .grow { margin-right: auto; }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 8px 12px; border-radius: 8px; background: var(--danger-soft); }

/* Küche */
.kitchen-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.kitchen-head h1 { font-family: var(--f-display); font-size: clamp(40px, 6vw, 60px); line-height: 1; }
.kitchen-head p { margin: 6px 0 0; color: var(--muted); max-width: 60ch; }
.pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.pill.live { background: var(--ok-soft); color: var(--ok); }
.pill.draft { background: var(--soft); color: var(--muted); }
.pill.changed { background: var(--warn-soft); color: var(--warn); }
.ktable { width: 100%; border-collapse: collapse; }
.ktable th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--rule-strong); }
.ktable td { padding: 10px; border-bottom: 1px solid var(--rule); vertical-align: middle; }
.ktable td.t a { font-family: var(--f-display); font-size: 22px; text-decoration: none; line-height: 1.1; }
.ktable td.act { text-align: right; white-space: nowrap; }
.ktable .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--ch); margin-right: 6px; }
.tablewrap { overflow-x: auto; }
.panel { background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px; padding: 16px; }
.kgrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; margin: 18px 0 26px; }
.meter { height: 8px; background: var(--soft); border-radius: 99px; overflow: hidden; margin: 8px 0 4px; }
.meter i { display: block; height: 100%; background: var(--ok); }
.form { display: grid; gap: 18px; }
.field { display: grid; gap: 6px; min-width: 0; }
.field > span { font-weight: 700; font-size: 14px; }
.field small { color: var(--muted); font-size: 12.5px; }
textarea.inp { resize: vertical; line-height: 1.5; }
textarea.mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 14px; }
.row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.checks { display: flex; gap: 14px; flex-wrap: wrap; }
.checks label { display: inline-flex; align-items: center; gap: 6px; }
.edit-title { font-family: var(--f-display); font-size: clamp(36px, 5vw, 52px); line-height: 1; }
.stepnav { display: flex; gap: 8px; margin: 14px 0 22px; flex-wrap: wrap; }
.stepnav span { font-size: 13px; padding: 4px 12px; border-radius: 999px; background: var(--soft); color: var(--muted); font-weight: 700; }
.stepnav span.on { background: var(--ink); color: var(--paper); }
.srcgrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
.drop { border: 2px dashed var(--rule-strong); border-radius: 10px; padding: 22px; display: grid; gap: 10px; justify-items: center; text-align: center; background: var(--sheet); }
.drop.over { border-color: var(--ok); background: var(--ok-soft); }
.drop p { margin: 0; color: var(--muted); }
.photos { display: flex; gap: 12px; flex-wrap: wrap; }
.photo { width: 150px; display: grid; gap: 6px; font-size: 13px; }
.photo .th { width: 150px; height: 150px; border-radius: 8px; overflow: hidden; border: 1px solid var(--rule); background: var(--soft); }

rikapulver und Gyrosgewürz vermengen und etwa 2 Stunden einlegen.","section":"Marinieren"},{"text":"Das marinierte Fleisch mit Zwiebel und Knoblauch in einer Pfanne anbraten.","section":"Zubereitung"},{"text":"Paprika und Champignons hinzufügen und etwas einkochen lassen.","section":"Zubereitung"},{"text":"Das Mehl darüberstäuben und vorsichtig umrühren, bis sich die Flüssigkeit bindet.","section":"Zubereitung"},{"text":"Das Tomatenmark hinzufügen.","section":"Zubereitung"},{"text":"Mit dem Metaxa ablöschen und kurz verkochen lassen.","section":"Zubereitung"},{"text":"Sahne und Schmand einrühren und mit einer Prise Zucker abschmecken.","section":"Zubereitung"},{"text":"Die Masse 20 bis 25 Minuten leicht offen köcheln lassen und dabei immer wieder umrühren.","section":"Zubereitung"},{"text":"Alles in eine ofenfeste Form füllen und mit dem geriebenen Gouda bestreuen.","section":"Überbacken"},{"text":"Bei 200 °C 10 bis 15 Minuten im Ofen überbacken, bis der Käse schön zerlaufen ist.","section":"Überbacken"}],"tips":"","source":"","id":"rmwo4pifcv5vb4","createdAt":"2026-11-19T22:35:41.832Z","updatedAt":"2026-11-19T22:35:41.832Z","example":false},{"title":"Jackfrucht-„Ente“ (Pulled Jackfruit)","description":"Saftig geschmorte, gezupfte Jackfrucht mit Majoran, Beifuß und Orange – der vegane Weihnachtsenten-Belag für Pizza, gut vorzubereiten.","category":"Pasta & Pizza","tags":["Jackfrucht","Pizzabelag","Weihnachten","Pulled","Meal Prep","Weihnachtsmarkt"],"diet":["vegan","vegetarisch","laktosefrei"],"servings":5,"servingsUnit":"Pizzen","prepMinutes":15,"cookMinutes":40,"restMinutes":null,"difficulty":"einfach","pan":null,"ingredientGroups":[{"name":"","items":[{"qty":2,"qtyMax":null,"unit":"Dose","name":"Junge grüne Jackfrucht","note":"in Salzlake, nicht in Sirup (ca. 400 g)"},{"qty":2,"qtyMax":null,"unit":"EL","name":"Öl","note":""},{"qty":1,"qtyMax":null,"unit":"","name":"Zwiebel","note":"fein gewürfelt"},{"qty":1,"qtyMax":null,"unit":"TL","name":"Majoran","note":"getrocknet"},{"qty":0.5,"qtyMax":null,"unit":"TL","name":"Beifuß","note":"getrocknet"},{"qty":0.5,"qtyMax":null,"unit":"TL","name":"Paprikapulver","note":"geräuchert"},{"qty":1,"qtyMax":null,"unit":"Prise","name":"Zimt","note":""},{"qty":2,"qtyMax":null,"unit":"","name":"Pimentkörner","note":""},{"qty":1,"qtyMax":null,"unit":"","name":"Lorbeerblatt","note":""},{"qty":1,"qtyMax":null,"unit":"","name":"Orange","note":"Bio, Abrieb und Saft"},{"qty":100,"qtyMax":null,"unit":"ml","name":"Rotwein","note":"vegan, alternativ Gemüsebrühe"},{"qty":2,"qtyMax":null,"unit":"EL","name":"Sojasauce","note":""},{"qty":1,"qtyMax":null,"unit":"EL","name":"Rübensirup","note":"oder Ahornsirup"},{"qty":1,"qtyMax":null,"unit":"EL","name":"Tomatenmark","note":""},{"qty":null,"qtyMax":null,"unit":"","name":"Salz und Pfeffer","note":"nach Geschmack"}]}],"steps":[{"text":"Jackfrucht abtropfen lassen, kurz abspülen und gut ausdrücken. Harte Kernstücke abschneiden und die Jackfrucht mit den Fingern grob zerzupfen.","section":"Schmoren"},{"text":"Zwiebel im Öl glasig dünsten, Jackfrucht dazugeben und 5 Minuten kräftig anbraten.","section":"Schmoren"},{"text":"Tomatenmark und alle trockenen Gewürze dazugeben und kurz mitrösten.","section":"Schmoren"},{"text":"Mit Rotwein, Orangensaft, Sojasauce und Rübensirup ablöschen und den Orangenabrieb dazugeben.","section":"Schmoren"},{"text":"Zugedeckt bei mittlerer Hitze 20 bis 30 Minuten schmoren, gelegentlich umrühren.","section":"Schmoren"},{"text":"Deckel abnehmen und einkochen, bis die Flüssigkeit glänzend an der Jackfrucht klebt und nichts mehr tropft. Piment und Lorbeerblatt entfernen.","section":"Fertigstellen"},{"text":"Mit zwei Gabeln fertig zerzupfen und mit Salz und Pfeffer abschmecken.","section":"Fertigstellen"},{"text":"Optional kurz in einer heißen Pfanne anbraten, damit ein paar Ränder Röstaromen bekommen.","section":"Fertigstellen"}],"tips":"Haltbarkeit: gekühlt 4–5 Tage, eingefroren ca. 3 Monate. Portioniert in GN-Behältern lagern.\nAuf der t und Salz 10 bis 15 Minuten weich kochen.","section":"Kochen"},{"text":"Sehr fein pürieren und durch ein Sieb streichen, damit die Tülle der Spritzflasche nicht verstopft.","section":"Kochen"},{"text":"Einkochen, bis die Masse langsam vom Löffel läuft, etwa wie dicker Sirup. Dosenbirnen brauchen dafür etwas länger.","section":"Kochen"},{"text":"Vom Herd nehmen, weißen Balsamico, Pfeffer und optional Birnenbrand einrühren und abschmecken.","section":"Fertigstellen"},{"text":"Optional mit Xanthan nachdicken und mit dem Stabmixer einarbeiten. Keine Speisestärke verwenden, sie wird nach dem Auftauen wässrig.","section":"Fertigstellen"}],"tips":"Einfrieren: abgekühlt flach in Gefrierbeuteln à 500 ml portionieren, hält 3–6 Monate. Über Nacht im Kühlschrank auftauen, durchrühren, Ecke abschneiden und in die Spritzflasche füllen. Aufgetaut 4–5 Tage haltbar.\nAm Stand wird das Coulis bei Kälte dicker: Flasche nah am Ofen lagern oder mit einem Schluck Wasser verdünnen.\nEinsatz: herzhaft auf Birne–Gorgonzola–Walnuss mit frischem Thymian, süß auf der Schoko-Birnen-Pizza nach dem Backen.\nMit frischen Birnen: 1 kg reife Williams-Birnen, 200 ml Apfelsaft statt Dosensirup und ca. 80 g Zucker.\nRestlichen Dosensirup auf ein Drittel einkochen: ergibt einen Birnensirup als Honig-Ersatz, ebenfalls einfrierbar.","source":"","id":"rbirnencoulis","createdAt":"2026-11-21T22:10:00.000Z","updatedAt":"2026-11-21T22:10:00.000Z","example":false},{"title":"Aioli Vegane Knoblauchmayo","description":"Schnelle Knoblauchsauce aus Öl und Milch, die mit dem Stabmixer zubereitet wird.","category":"Saucen, Dips & Dressings","tags":["Knoblauch","Mayo","Stabmixer","Grillen","Dip"],"diet":["vegetarisch"],"servings":4,"servingsUnit":"Portionen","prepMinutes":null,"cookMinutes":null,"restMinutes":null,"difficulty":"einfach","pan":null,"ingredientGroups":[{"name":"","items":[{"qty":200,"qtyMax":null,"unit":"ml","name":"Öl","note":"neutrales Öl; Sorte nicht angegeben"},{"qty":60,"qtyMax":null,"unit":"ml","n function buildPage(pub) {

    + '<style id="kk-css">' + css + '</style>\n<div id="app"></div>\n'
    + '<script type="application/json" id="kk-data">' + data + '<\/script>\n'
    + '<script id="kk-app">' + app + '<\/script>\n</body></html>';
}
async function makeThumb(src, max = 1100) {
  const img = new Image(); img.src = src;
  await img.decode();
  const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const cv = document.createElement("canvas"); cv.width = Math.round(img.naturalWidth * s); cv.height = Math.round(img.naturalHeight * s);
  cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
  return cv.toDataURL("image/jpeg", .74);
}
async function toPublic(r) {
  const p = structuredClone(r);
  delete p.coverId; delete p.originalIds; delete p.favorite; delete p.coverThumb;
  if (r.coverId) { try { p.coverThumb = await makeThumb(blobUrl(r.coverId)); } catch {} }
  else if (r.coverThumb) p.coverThumb = r.coverThumb;
  return p;
}
function pubMsg(html) { const el = $("#pubMsg"); if (el) el.innerHTML = html; }
async function publishSite(mutate, doneMsg, returnHash) {
  if (S.busyPublish) return;
  if (!S.art) { pubMsg(`<div class="note err">Veröffentlichen ist in dieser Ansicht nicht möglich.</div>`); return; }
  S.busyPublish = true;
  pubMsg(`<div class="note pending"><div class="spinner"></div><span>Kochbuch wird veröffentlicht …</span></div>`);
  try {
    const next = structuredClone(PUB);
    await mutate(next);
    next.publishedAt = new Date().toISOString();
    const html = buildPage(next);
    if (new Blob([html]).size > MAX_PAGE_BYTES) throw { code: "too_large" };
    ssSet("kk-return", { hash: returnHash ?? location.hash, msg: doneMsg });
    await S.art.publish(html);
  } catch (e) {
    S.busyPublish = false;
    try { sessionStorage.removeItem("kk-return"); } catch {}
    const m = {
      conflict: "Gerade wurde eine neuere Fassung veröffentlicht. Die Seite lädt neu, bitte danach noch einmal versuchen.",
      not_writer: "Nur Personen mit Bearbeitungsrecht können veröffentlichen.", not_granted: "Nur Personen mit Bearbeitungsrecht können veröffentlichen.",
      too_large: "Das Kochbuch wäre zu groß. Nimm alte Rezepte heraus oder lass bei einigen das Titelbild weg.",
      rate_limited: "Zu viele Veröffentlichungen kurz hintereinander. Bitte in einer Minute noch einmal."
    };
    pubMsg(`<div class="note err">${esc(m[e?.code] || "Veröffentlichen hat nicht geklappt. Bitte noch einmal versuchen.")}</div>`);
  }
}
function publishRecipes(ids, overrides = {}, returnHash) {
  const recs = ids.map((id) => overrides[id] || S.dbRecipes.get(id)).filter(Boolean);
  if (!recs.length) return;
  return publishSite(async (p) => {
    for (const r of recs) {
      const pr = await toPublic(r);
      p.recipes = p.recipes.filter((x) => x.id !== r.id).concat(pr);
    }
  }, recs.length === 1 ? `„${recs[0].title}“ steht jetzt im Kochbuch` : `${recs.length} Rezepte veröffentlicht`, returnHash);
}
function unpublishRecipe(id) {
  const r = pubById.get(id);
  return publishSite((p) => { p.recipes = p.recipes.filter((x) => x.id !== id); }, `„${r?.title || "Rezept"}“ aus dem Kochbuch genommen`);
}

async function toJpeg(file, max = 2000) {
  const bmp = await createImageBitmap(file).catch(() => null);
  if (!bmp) throw new Error("Das Bild „" + file.name + "“ kann der Browser nicht lesen. Bitte als JPG oder PNG speichern.");
  const s = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const cv = document.createElement("canvas"); cv.width = Math.round(bmp.width * s); cv.height = Math.round(bmp.height * s);
  cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);
  return await new Promise((res) => cv.toBlob(res, "image/jpeg", .86));
}
async function addFiles(files) {
  const E = S.edit; E.err = "";

    if (!f.type.startsWith("image/") && !/\.(heic|heif)$/i.test(f.name)) continue;
    try { const b = await toJpeg(f); E.photos.push({ kind: "new", blob: b, url: URL.createObjectURL(b), keep: true }); } catch (e) { E.err = e.message; }
  }
  renderEdit();
}

async function saveRecipe(andPublish) {
  const E = S.edit; collectForm(); const d = E.data;
  if (!d.title) { E.err = "Bitte einen Titel eingeben."; renderEdit(); return; }
  if (!S.db) { E.err = "Speichern ist in dieser Ansicht nicht möglich."; renderEdit(); return; }
  E.busy = true; E.err = ""; renderEdit();
  try {
    const old = E.recipeId ? S.dbRecipes.get(E.recipeId) : null;
    const before = new Set([old?.coverId, ...(old?.originalIds || [])].filter(Boolean));
    let coverId = null; const originalIds = [];
    for (let i = 0; i < E.photos.length; i++) {
      const p = E.photos[i]; const isCover = E.cover === i;
      if (!isCover && !p.keep) continue;
      if (p.kind === "new") { if (!S.assets) continue; const res = await S.assets.upload(p.blob, { type: "image/jpeg" }); Object.assign(p, { kind: "asset", id: res.id }); }
      if (isCover) coverId = p.id; else originalIds.push(p.id);
    }
    const id = E.recipeId || newId(); const now = new Date().toISOString();
    const rec = { ...d, id, coverId, originalIds, createdAt: old?.createdAt || now, updatedAt: now, example: !!old?.example };
    delete rec.coverThumb; delete rec.favorite;
    for (const k of Object.keys(rec)) if (rec[k] === undefined) delete rec[k];
    await S.db.doc("recipes/" + id).set(rec);
    const after = new Set([coverId, ...originalIds].filter(Boolean));
    if (S.assets) for (const a of before) if (!after.has(a)) { try { await S.assets.delete(a); } catch {} }
    S.dbRecipes.set(id, rec); S.calc = null;
    if (andPublish) {
      E.busy = false; E.recipeId = id;
      await publishRecipes([id], { [id]: rec }, "#entwurf-" + id);
      if (!S.busyPublish) { S.edit = null; location.hash = "entwurf-" + id; toast("Gespeichert, aber nicht veröffentlicht. Bitte noch einmal versuchen."); }
      return;
    }
    S.edit = null; toast("Gespeichert. Noch nicht im Kochbuch."); location.hash = "entwurf-" + id;
  } catch (e) {
    E.busy = false;
    E.err = e?.code === "quota_exceeded" || e?.code === "quota_or_state" ? "Der Speicher ist voll. Lösche alte Rezepte oder Fotos und versuche es erneut."
      : e?.code === "too_large" ? "Ein Foto ist zu groß." : "Speichern fehlgeschlagen. Bitte noch einmal versuchen.";
    renderEdit();
  }
}

function buildPrompt(text, nImages) {
  return `Du bist die Rezeptredaktion eines privaten, deutschsprachigen Kochbuchs. Wandle die folgende Vorlage in genau EIN Rezept im einheitlichen Format um.
${nImages ? `Es sind ${nImages} Foto(s) angehängt (Nummern 0 bis ${nImages - 1} in der Reihenfolge). Sie können Kochbuchseiten, handschriftliche Zettel, Screenshots oder ein Foto des fertigen Gerichts zeigen. Lies Text auf den Fotos sorgfältig, auch Handschrift.` : ""}
${text.trim() ? `\nVORLAGE (Text):\n"""\n${text.trim().slice(0, 30000)}\n"""\n` : ""}
REGELN
- Alles auf Deutsch. Fremdsprachige Rezepte übersetzen. Zutatennamen in deutscher Küchensprache (z. B. "Weizenmehl Type 405", "Schmand").
- Einheiten metrisch und einheitlich: g, kg, ml, l, EL, TL, Msp., Prise, Stück, Zehe, Bund, Dose, Pck., Scheibe, Blatt, Becher, Zweig, Stange, Glas, Handvoll, Spritzer, cm. Cups, oz, lb, fl oz, °F umrechnen (1 cup Mehl ≈ 125 g, Zucker ≈ 200 g, Flüssigkeit 240 ml, Butter ≈ 225 g; 1 oz = 28 g; 1 lb = 454 g; °F in °C). Bei Umrechnung den Originalwert in "note" vermerken, z. B. "urspr. 1 cup".
- Zählbare Zutaten ohne Einheit: unit "" (z. B. 3 Eier → qty 3, unit "", name "Eier").
- qty als Zahl (0.5 statt "½"), Spannen als qty + qtyMax. Ohne Menge ("Salz nach Geschmack"): qty null, Hinweis in note.
- Name kurz, Zubereitungshinweise ("gewürfelt", "zimmerwarm") in note.
- Zutaten nach Abschnitten gruppieren, wenn die Vorlage welche hat (z. B. "Für den Teig"), sonst eine Gruppe mit name "".
- Schritte: klare, vollständige Sätze im Imperativ, ein Arbeitsgang pro Schritt, Temperaturen und Zeiten drin lassen (z. B. "bei 180 °C Ober-/Unterhitze 35 Minuten backen"). Abschnittstitel in "section", sonst "".
- Nichts erfinden. Fehlende Angaben null bzw. "". Unklares oder Unleserliches in "warnings" kurz benennen.
- category: genau eine aus ${JSON.stringify(CATEGORIES)}.
- diet: zutreffende aus ${JSON.stringify(DIETS)} (nur wenn sicher).
- tags: 2 bis 6 kurze, nützliche Schlagwörter auf Deutsch (Hauptzutat, Küche/Land, Anlass, Garmethode), ohne Kategorie und Ernährungsform zu wiederholen.
- servings: Zahl, für die das Rezept geschrieben ist; servingsUnit: "Portionen", "Stück", "Kuchen", "Blech", "Gläser", "Brote" oder "Pizzen".
- difficulty: "einfach", "mittel" oder "anspruchsvoll" nach deiner Einschätzung.
- pan: nur bei Backform/Blech/Auflaufform mit Größenangabe; rund {"shape":"rund","diameter":26}, eckig {"shape":"eckig","width":30,"length":40}; sonst null.
- coverImageIndex: Nummer des Fotos, das das fertige Gericht zeigt, sonst null.
- source: Buchtitel/Website/Person, wenn erkennbar, sonst "".
- tips: Tipps, Varianten, Aufbewahrung aus der Vorlage als kurzer Text, sonst "".

Antworte NUR mit einem JSON-Objekt in genau dieser Form:
{"title":"","description":"","category":"","tags":[],"diet":[],"servings":4,"servingsUnit":"Portionen","prepMinutes":null,"cookMinutes":null,"restMinutes":null,"difficulty":"einfach","pan":null,"ingredientGroups":[{"name":"","items":[{"qty":200,"qtyMax":null,"unit":"g","name":"Weizenmehl Type 405","note":""}]}],"steps":[{"text":"","section":""}],"tips":"","source":"","coverImageIndex":null,"warnings":[]}`;
}
function normalizeParsed(o) {
  const d = emptyRecipe();
  const str = (v) => (typeof v === "string" ? v.trim() : "");
  const num = (v) => { const n = typeof v === "number" ? v : numVal(v ?? ""); return isFinite(n) && n > 0 ? n : null; };
  d.title = str(o.title) || "Neues Rezept"; d.description = str(o.description);
  d.category = CATEGORIES.includes(o.category) ? o.category : "Hauptgerichte";
  d.tags = Array.isArray(o.tags) ? o.tags.map(str).filter(Boolean).slice(0, 8) : [];
  d.diet = Array.isArray(o.diet) ? o.diet.filter((x) => DIETS.includes(x)) : [];
  d.servings = num(o.servings) ?? 4; d.servingsUnit = str(o.servingsUnit) || "Portionen";
  d.prepMinutes = num(o.prepMinutes); d.cookMinutes = num(o.cookMinutes); d.restMinutes = num(o.restMinutes);
  d.difficulty = DIFFS.includes(o.difficulty) ? o.difficulty : "mittel";
  const p = o.pan;
  d.pan = p && p.shape === "rund" && num(p.diameter) ? { shape: "rund", diameter: num(p.diameter) } : p && p.shape === "eckig" && num(p.width) && num(p.length) ? { shape: "eckig", width: num(p.width), length: num(p.length) } : null;
  d.ingredientGroups = (Array.isArray(o.ingredientGroups) ? o.ingredientGroups : []).map((g) => ({
    name: str(g?.name),
    items: (Array.isArray(g?.items) ? g.items : []).map((it) => { const k = str(it?.unit).toLowerCase().replace(/\.$/, ""); return { qty: num(it?.qty), qtyMax: num(it?.qtyMax), unit: UNIT_ALIASES[k] || str(it?.unit), name: str(it?.name), note: str(it?.note) }; }).filter((it) => it.name)
  })).filter((g) => g.items.length);
  d.steps = (Array.isArray(o.steps) ? o.steps : []).map((s) => typeof s === "string" ? { text: s.trim(), section: "" } : { text: str(s?.text), section: str(s?.section) }).filter((s) => s.text);
  d.tips = str(o.tips); d.source = str(o.source);
  return { d, cover: Number.isInteger(o.coverImageIndex) ? o.coverImageIndex : null, warnings: Array.isArray(o.warnings) ? o.warnings.map(str).filter(Boolean) : [] };
}
async function runImport() {
  const E = S.edit; E.err = "";
  if (!E.srcText.trim() && !E.photos.length) { E.err = "Füge zuerst Text ein oder lade ein Foto hoch."; renderEdit(); return; }
  const imgs = E.photos.filter((p) => p.kind === "new").map((p) => p.blob);
  if (imgs.length) {
    const lim = await S.sample.limits().catch(() => null);
    if (!lim?.images) { E.err = "Fotos können in dieser Ansicht nicht an Claude geschickt werden. Bitte den Text einfügen."; renderEdit(); return; }
    if (imgs.length > lim.images.maxCount) { E.err = `Bitte höchstens ${lim.images.maxCount} Fotos auf einmal.`; renderEdit(); return; }
  }
  E.busy = true; renderEdit();
  S.importCtl = new AbortController();
  try {
    const out = await S.sample.json(buildPrompt(E.srcText, imgs.length), {
      signal: S.importCtl.signal, ...(imgs.length ? { images: imgs } : {}),
      onText: () => { const t = $("#liveTxt"); if (t) t.textContent = "Claude schreibt das Rezept …"; }
    });
    const { d, cover, warnings } = normalizeParsed(out || {});
    E.data = d; E.warnings = warnings; E.fromClaude = true;
    const newPhotos = E.photos.filter((p) => p.kind === "new");
    E.cover = cover != null && cover >= 0 && cover < newPhotos.length ? E.photos.indexOf(newPhotos[cover]) : -1;
    E.photos.forEach((p, i) => { p.keep = i !== E.cover; });
    E.busy = false; E.step = 2; renderEdit();
  } catch (e) {
    E.busy = false;
    const map = {
      cancelled: "", not_granted: "Du hast die Nutzung von Claude für diese Seite nicht erlaubt. Du kannst das Rezept von Hand eintragen.",
      rate_limited: "Gerade zu viele Anfragen. Bitte in ein paar Minuten noch einmal versuchen.",
      image_rejected: "Ein Foto wurde nicht angenommen (Format oder Größe). Bitte ein anderes Foto verwenden.",
      invalid_json: "Die Antwort war nicht im erwarteten Format. Bitte noch einmal versuchen.",
      refused: "Claude konnte diese Vorlage nicht verarbeiten.", prompt_too_large: "Der Text ist zu lang. Bitte nur das eine Rezept einfügen.",
      session_expired: "Bitte neu bei Claude anmelden."
    };
    E.err = map[e?.code] ?? "Das Aufbereiten hat nicht geklappt. Bitte noch einmal versuchen.";
    if (e?.code === "not_granted" || e?.code === "sampling_disabled") S.sample = null;
    renderEdit();
  }
}

  const back = ssTake("kk-return");
  if (back) {
    if (back.hash && back.hash !== location.hash) { try { history.replaceState(null, "", back.hash); } catch { location.hash = back.hash; } }
    if (back.msg) setTimeout(() => toast(back.msg), 300);
  }
})();
route();
(async () => {
  const cl = window.claude;
  if (!cl || !cl.use) { S.capsReady = true; rerenderKitchenViews(); return; }
  const user = await cl.use("user").catch(() => null);
  if (user) { try { S.canEdit = !!(await user.canEdit()); } catch {} }
  if (!S.canEdit) { S.capsReady = true; rerenderKitchenViews(); return; }
  const [db, sample, assets, downloads, art] = await Promise.all(["db", "sample", "assets", "downloads", "artifact"].map((n) => cl.use(n).catch(() => null)));
  Object.assign(S, { db, sample, assets, downloads, art, capsReady: true });
  if (!db) { S.dbErr = "Die Küche ist in dieser Ansicht nicht erreichbar."; rerenderKitchenViews(); return; }
  const timer = setTimeout(() => { if (!S.dbLoaded) { S.dbErr = "Die Rezepte lassen sich gerade nicht laden. Bitte später erneut öffnen."; rerenderKitchenViews(); } }, 10000);
  db.collection("recipes").limit(1000).onSnapshot((snap) => {
    const m = new Map(); for (const d of snap.docs) { const r = d.data(); if (r) m.set(d.id, { ...r, id: d.id }); }
    S.dbRecipes = m;
    if (!snap.metadata.fromCache) { S.dbLoaded = true; S.dbErr = ""; clearTimeout(timer); } else if (m.size) S.dbLoaded = true;
    const h = currentRoute();
    if (h.startsWith("bearbeiten-") && S.edit) return;
    if (h === "neu" && S.edit) { renderHeader(); return; }
    rerenderKitchenViews();
  }, (e) => { clearTimeout(timer); S.dbErr = "Die Rezepte konnten nicht geladen werden (" + e.code + ")."; rerenderKitchenViews(); });
  rerenderKitchenViews();
})();
</script>
