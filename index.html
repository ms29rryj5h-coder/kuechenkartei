Wasser, in der Notiz stehen 190 ml.","title":"Nudelteig ohne Ei","updatedAt":"2026-11-24T23:03:44.932Z"},{"category":"Kuchen & Gebäck","cookMinutes":8,"createdAt":"2024-11-06T15:59:51.000Z","description":"Zarte Vanillekipferl aus Mandel-Mürbeteig, noch warm in Vanille-Puderzucker gewälzt.","diet":["vegetarisch"],"difficulty":"mittel","example":false,"id":"rmwvawugxcijrd","ingredientGroups":[{"items":[{"name":"Weizenmehl Type 405","note":"","qty":300,"qtyMax":null,"unit":"g"},{"name":"Mandeln","note":"gemahlen, blanchiert","qty":100,"qtyMax":null,"unit":"g"},{"name":"Puderzucker","note":"","qty":120,"qtyMax":null,"unit":"g"},{"name":"Vanilleschote","note":"","qty":1,"qtyMax":null,"unit":""},{"name":"Salz","note":"","qty":1,"qtyMax":null,"unit":"Prise"},{"name":"Butter","note":"kalt","qty":225,"qtyMax":null,"unit":"g"},{"name":"Eigelbe","note":"Größe M","qty":3,"qtyMax":null,"unit":""}],"name":"Für die Kipferl"},{"items":[{"name":"Puderzucker","note":"zum Wälzen","qty":120,"qtyMax":null,"unit":"g"},{"name":"Bourbon-Vanillezucker","note":"","qty":1,"qtyMax":null,"unit":"Pck."}],"name":"Für die Puderzuckermischung"}],"pan":null,"prepMinutes":null,"restMinutes":60,"servings":60,"servingsUnit":"Stück","source":"","steps":[{"section":"","text":"Mehl mit Mandeln und Puderzucker in einer Schüssel mischen."},{"section":"","text":"Die Vanilleschote längs aufschneiden und das Mark herauskratzen. Mit Salz, Butter in Würfeln und den Eigelben zugeben."},{"section":"","text":"Alles mit den Händen rasch zu einem glatten Teig kneten, in Folie wickeln und 1 Stunde kalt stellen."},{"section":"","text":"Den Backofen auf 180 °C Ober-/Unterhitze (Umluft 160 °C) vorheizen und Bleche mit Backpapier belegen."},{"section":"","text":"Den Teig vierteln. Portionsweise aus dem Kühlschrank nehmen, aus walnussgroßen Stücken Hörnchen formen und mit Abstand auf das Blech legen."},{"section":"","text":"Die Kipferl etwa 8 Minuten backen. Sie sind dann noch weich und werden beim Abkühlen fest."},{"section":"","text":"Währenddessen Puderzucker und Vanillezucker in einer Schale mischen."},{"section":"","text":"Die Kipferl direkt nach dem Backen vorsichtig in der Mischung wälzen und auf einem Gitter vollständig erkalten lassen."}],"tags":["Plätzchen","Weihnachten","Mandeln","Mürbeteig"],"tips":"","title":"Vanillekipferl","updatedAt":"2026-11-24T23:03:44.932Z"},{"category":"Desserts","cookMinutes":null,"createdAt":"2021-12-04T11:59:13.000Z","description":"Tiramisu ohne Kaffee mit Spekulatius, gefrorenen Waldfrüchten und Mascarpone-Quark-Creme aus der Auflaufform.","diet":["vegetarisch"],"difficulty":"einfach","example":false,"id":"rmwvawui5re2w4","ingredientGroups":[{"items":[{"name":"Schlagsahne","note":"","qty":200,"qtyMax":null,"unit":"g"},{"name":"Sahnesteif","note":"","qty":1,"qtyMax":null,"unit":"Pck."},{"name":"Vanillezucker","note":"für die Sahne","qty":1,"qtyMax":null,"unit":"Pck."},{"name":"Mascarpone","note":"","qty":200,"qtyMax":null,"unit":"g"},{"name":"Magerquark","note":"","qty":250,"qtyMax":null,"unit":"g"},{"name":"Vanillezucker","note":"für die Creme","qty":2,"qtyMax":null,"unit":"Pck."},{"name":"Zucker","note":"","qty":100,"qtyMax":null,"unit":"g"},{"name":"Waldfrüchte","note":"gefroren","qty":300,"qtyMax":null,"unit":"g"},{"name":"Spekulatius","note":"","qty":null,"qtyMax":null,"unit":""},{"name":"Puderzucker","note":"","qty":null,"qtyMax":null,"unit":""},{"name":"Kakao","note":"","qty":null,"qtyMax":null,"unit":""}],"name":""}],"pan":null,"prepMinutes":null,"restMinutes":270,"servings":6,"servingsUnit":"Portionen","source":"","steps":[{"section":"","text":"Die Sahne mit Sahnesteif und 1 Päckchen Vanillezucker steif schlagen."},{"section":"","text":"Mascarpone, Quark, 2 Päckchen Vanillezucker und Zucker gut mischen und unter die Sahne heben."},{"section":"","text":"Eine dünne Schicht Creme in eine Auflaufform geben, darauf eine Schicht Spekulatius."},{"section":"","text":"Die gefrorenen Beeren darauf verteilen und mit der restlichen Creme bedecken."},{"section":"","text":"Mit einer Schicht Spekulatius abschließen."},{"section":"","text":"4 bis 5 Stunden im Kühlschrank ziehen lassen."}],"tags":["Tiramisu","Spekulatius","Waldfrüchte","Weihnachten","Mascarpone"],"tips":"","title":"Weihnachts-Tiramisu","updatedAt":"2026-11-24T23:03:44.932Z"},{"category":"Kuchen & Gebäck","cookMinutes":19,"createdAt":"2024-10-05T22:11:17.000Z","description":"Fluffige Zimtschnecken mit süßem Sauerteig-Levain, langer kalter Gare und Frischkäse-Frosting.","diet":["vegetarisch"],"difficulty":"anspruchsvoll","example":false,"id":"rmwvawugtsaati","ingredientGroups":[{"items":[{"name":"Sauerteig-Anstellgut","note":"aktiv","qty":50,"qtyMax":null,"unit":"g"},{"name":"Vollmilch","note":"kalt","qty":50,"qtyMax":null,"unit":"g"},{"name":"Weizenmehl","note":"","qty":50,"qtyMax":null,"unit":"g"},{"name":"Zucker","note":"","qty":10,"qtyMax":null,"unit":"g"}],"name":"Süßer Levain"},{"items":[{"name":"Weizenmehl","note":"","qty":600,"qtyMax":null,"unit":"g"},{"name":"Zucker","note":"","qty":100,"qtyMax":null,"unit":"g"},{"name":"Salz","note":"","qty":11,"qtyMax":null,"unit":"g"},{"name":"Zimt","note":"","qty":0.75,"qtyMax":null,"unit":"TL"},{"name":"Vollmilch","note":"kalt","qty":275,"qtyMax":null,"unit":"g"},{"name":"Eier","note":"2 mittelgroße","qty":110,"qtyMax":null,"unit":"g"},{"name":"süßer Levain","note":"von oben","qty":160,"qtyMax":null,"unit":"g"},{"name":"Butter","note":"weich, ungesalzen","qty":120,"qtyMax":null,"unit":"g"}],"name":"Hauptteig"},{"items":[{"name":"Butter","note":"weich, ungesalzen","qty":150,"qtyMax":null,"unit":"g"},{"name":"Rohrzucker","note":"dunkel","qty":240,"qtyMax":null,"unit":"g"},{"name":"Zimt","note":"2 EL","qty":20,"qtyMax":null,"unit":"g"}],"name":"Zimtfüllung"},{"items":[{"name":"Frischkäse","note":"Vollfettstufe","qty":200,"qtyMax":null,"unit":"g"},{"name":"Butter","note":"weich, ungesalzen","qty":50,"qtyMax":null,"unit":"g"},{"name":"Puderzucker","note":"gesiebt","qty":150,"qtyMax":null,"unit":"g"},{"name":"Vanilleextrakt","note":"oder ½ Vanilleschote","qty":0.5,"qtyMax":null,"unit":"TL"},{"name":"Zitronenabrieb","note":"plus 2 TL Zitronensaft","qty":0.5,"qtyMax":null,"unit":"TL"},{"name":"Salz","note":"","qty":1,"qtyMax":null,"unit":"Prise"},{"name":"griechischer Joghurt","note":"","qty":2,"qtyMax":null,"unit":"EL"}],"name":"Frischkäse-Frosting"},{"items":[{"name":"Ei","note":"","qty":1,"qtyMax":null,"unit":""},{"name":"Wasser","note":"","qty":1,"qtyMax":null,"unit":"EL"}],"name":"Eistreiche"}],"pan":{"length":34,"shape":"eckig","width":25},"prepMinutes":null,"restMinutes":1410,"servings":20,"servingsUnit":"Stück","source":"","steps":[{"section":"Süßer Levain","text":"Alle Zutaten in einer Schüssel gut vermischen, abdecken und an einem warmen Ort 4 Stunden ruhen lassen."},{"section":"Hauptteig","text":"Alle Zutaten außer der Butter in die Schüssel der Küchenmaschine geben und mit dem Knethaken auf mittlerer Stufe kneten, bis der Teig zusammenkommt. Abdecken und 30 Minuten ruhen lassen. Keine Autolyse, sonst wird es klumpig."},{"section":"Hauptteig","text":"Den Teig etwa 10 Minuten auf mittlerer Stufe weiterkneten."},{"section":"Hauptteig","text":"Die gewürfelte, weiche Butter langsam Stück für Stück zugeben."},{"section":"Hauptteig","text":"Wenn die ganze Butter eingearbeitet ist, weitere 15 bis 25 Minuten kneten, bis der Teig den Fenstertest besteht."},{"section":"Hauptteig","text":"Den Teig in eine saubere Schüssel legen und an einem warmen Ort (ca. 26 °C) 2 Stunden gehen lassen, dabei jede halbe Stunde dehnen und falten."},{"section":"Hauptteig","text":"Den Teig danach mindestens 6 Stunden im Kühlschrank kalt gehen lassen."},{"section":"Zimtfüllung","text":"Weiche Butter, Zucker und Zimt mit einer Gabel zu einer streichfähigen Paste ohne Klümpchen verrühren, etwa so fest wie Nutella. Bis zum Formen bei Raumtemperatur stehen lassen."},{"section":"Formen","text":"Den Teig auf eine leicht bemehlte Arbeitsfläche legen. Ist er zu kalt zum Ausrollen, 10 bis 15 Minuten bei Raumtemperatur stehen lassen."},{"section":"Formen","text":"Den Teig zu einem Rechteck von etwa 60 × 30 cm ausrollen und die Zimtfüllung gleichmäßig darauf verteilen."},{"section":"Formen","text":"Den Teig von der langen Seite her so fest wie möglich aufrollen und die Enden abschneiden. Die Rolle noch einmal auf etwa 84 cm ausrollen."},{"section":"Formen","text":"Mit einem scharfen Messer oder Zahnseide etwa 4 cm breite Stücke schneiden, das ergibt etwa 20 Zimtschnecken."},{"section":"Formen","text":"Die Schnecken in eine mit Backpapier ausgelegte Form (25 × 34 cm) legen, abdecken und bei etwa 26 °C 10 bis 12 Stunden gehen lassen, bis sie sich verdoppelt haben. Dabei eher nach Aussehen und Gefühl als nach der Zeit gehen."},{"section":"Backen","text":"Den Ofen auf 180 °C vorheizen."},{"section":"Backen","text":"Die Zimtschnecken leicht mit der Eistreiche bestreichen und 18 bis 20 Minuten goldbraun backen."},{"section":"Frischkäse-Frosting","text":"Frischkäse und Butter mit dem Handmixer glatt und hell aufschlagen."},{"section":"Frischkäse-Frosting","text":"Die Hälfte des Puderzuckers zugeben und etwa 2 Minuten mixen. Den restlichen Puderzucker zugeben und weitermixen, bis die Masse leicht und fluffig ist."},{"section":"Frischkäse-Frosting","text":"Zum Schluss den Vanilleextrakt einrühren und das Frosting großzügig auf den gebackenen Zimtschnecken verteilen."}],"tags":["Zimtschnecken","Sauerteig","Frischkäse-Frosting","Lange Gare"],"tips":"In der Notiz stehen zusätzlich Mengen für die doppelte und die 2,5-fache Menge. Dafür den Mengenrechner nehmen.","title":"Zimtschnecken mit Sauerteig","updatedAt":"2026-11-24T23:03:44.932Z"},{"category":"Kuchen & Gebäck","cookMinutes":14,"createdAt":"2024-11-06T15:56:10.000Z","description":"Knusprige Mandelbaiser-Tupfen mit Zitrone und einem Hauch Pfeffer.","diet":["vegetarisch","glutenfrei","laktosefrei"],"difficulty":"mittel","example":false,"id":"rmwvawugykkc1a","ingredientGroups":[{"items":[{"name":"Bio-Zitrone","note":"","qty":1,"qtyMax":null,"unit":""},{"name":"Mandeln","note":"geschält und gemahlen","qty":200,"qtyMax":null,"unit":"g"},{"name":"Zucker","note":"","qty":35,"qtyMax":null,"unit":"g"},{"name":"Puderzucker","note":"","qty":120,"qtyMax":null,"unit":"g"},{"name":"Pfefferkörner","note":"frisch gemahlen","qty":0.5,"qtyMax":null,"unit":"TL"},{"name":"Eiweiß","note":"","qty":2,"qtyMax":null,"unit":""},{"name":"Pfeffer","note":"zum Bestreuen","qty":null,"qtyMax":null,"unit":""}],"name":""},{"items":[{"name":"Einwegspritzbeutel","note":"","qty":1,"qtyMax":null,"unit":""}],"name":"Außerdem"}],"pan":null,"prepMinutes":null,"restMinutes":120,"servings":35,"servingsUnit":"Stück","source":"","steps":[{"section":"","text":"Die Zitrone heiß abspülen und trocken tupfen. Die Schale fein abreiben und 1 EL Saft auspressen."},{"section":"","text":"Zitronensaft und -schale in einer Schüssel mit den gemahlenen Mandeln, dem Zucker, 50 g Puderzucker und dem Pfeffer mischen."},{"section":"","text":"Das Eiweiß mit den Quirlen des Handrührers steif schlagen und dabei nach und nach 50 g Puderzucker einrieseln lassen. Den festen Eischnee kurz unter die Mandelmischung heben."},{"section":"","text":"Die Masse in den Spritzbeutel füllen und auf ein mit Backpapier belegtes Blech Tupfen von etwa 3 cm Ø spritzen."},{"section":"","text":"Mit dem restlichen Puderzucker und etwas Pfeffer bestreuen und bei Zimmertemperatur etwa 2 Stunden trocknen lassen."},{"section":"","text":"Den Backofen auf 160 °C Umluft vorheizen."},{"section":"","text":"Die Amarettini auf der mittleren Schiene 12 bis 15 Minuten goldgelb backen, herausnehmen und ganz abkühlen lassen."}],"tags":["Plätzchen","Mandeln","Zitrone","Pfeffer","Weihnachten"],"tips":"","title":"Zitronen-Amarettini","updatedAt":"2026-11-24T23:03:44.932Z"},{"category":"Kuchen & Gebäck","cookMinutes":70,"createdAt":"2021-11-14T09:44:39.000Z","description":"Apfelkuchen mit Mürbeteigboden, Vanillepudding und Butterstreuseln aus der Springform.","diet":["vegetarisch"],"difficulty":"mittel","example":false,"id":"rmwvawui6f247w","ingredientGroups":[{"items":[{"name":"Ei","note":"","qty":1,"qtyMax":null,"unit":""},{"name":"Zucker","note":"","qty":80,"qtyMax":null,"unit":"g"},{"name":"Halbfettmargarine","note":"","qty":90,"qtyMax":null,"unit":"g"},{"name":"Salz","note":"","qty":1,"qtyMax":null,"unit":"Prise"},{"name":"Backpulver","note":"","qty":1,"qtyMax":null,"unit":"TL"},{"name":"Mehl","note":"","qty":180,"qtyMax":null,"unit":"g"}],"name":"Mürbeteig"},{"items":[{"name":"Äpfel","note":"z. B. Boskoop","qty":8,"qtyMax":null,"unit":""},{"name":"Zucker","note":"","qty":70,"qtyMax":null,"unit":"g"},{"name":"Vanillezucker","note":"","qty":1,"qtyMax":null,"unit":"Pck."},{"name":"Puddingpulver Vanille","note":"","qty":2,"qtyMax":null,"unit":"Pck."},{"name":"Milch","note":"1,5 % Fett","qty":700,"qtyMax":null,"unit":"ml"}],"name":"Belag"},{"items":[{"name":"Mehl","note":"","qty":100,"qtyMax":null,"unit":"g"},{"name":"Zucker","note":"kann teilweise durch Vanillezucker ersetzt werden","qty":65,"qtyMax":null,"unit":"g"},{"name":"Butter","note":"kalt","qty":65,"qtyMax":null,"unit":"g"}],"name":"Streusel"}],"pan":null,"prepMinutes":null,"restMinutes":null,"servings":1,"servingsUnit":"Kuchen","source":"chefkoch.de","steps":[{"section":"","text":"Aus Ei, Zucker, Margarine, Salz, Backpulver und Mehl einen Mürbeteig herstellen und kurz kühlen."},{"section":"","text":"Den Teig in eine gefettete Springform geben, dabei einen Rand hochziehen, und die Form noch einmal kalt stellen."},{"section":"","text":"Die Äpfel schälen, entkernen, in etwa 1,5 cm große Stücke schneiden und auf dem Teig verteilen."},{"section":"","text":"Zucker und Vanillezucker mit dem Puddingpulver und etwas Milch anrühren. Die übrige Milch aufkochen, die angerührte Mischung einrühren, noch einmal aufkochen und sofort über die Äpfel gießen."},{"section":"","text":"Aus kalter Butter, Zucker und Mehl schnell Streusel herstellen und auf dem Pudding verteilen, sobald er oben eine Haut gebildet hat."},{"section":"","text":"Im vorgeheizten Ofen bei 175 °C Umluft auf der unteren Schiene etwa 70 Minuten backen."},{"section":"","text":"Den Kuchen unbedingt vollständig auskühlen lassen."}],"tags":["Apfelkuchen","Pudding","Streusel","Springform"],"tips":"","title":"Apfelkuchen mit Pudding und Streuseln","updatedAt":"2026-11-24T23:03:44.932Z"},{"category":"Kuchen & Gebäck","cookMinutes":55,"createdAt":"2023-12-16T14:40:01.000Z","description":"Klassischer Christstollen mit rumgetränkten Rosinen, Zitronat und Orangeat, Mandeln und etwas Sauerteig im Butterteig.","diet":["vegetarisch"],"difficulty":"anspruchsvoll","example":false,"id":"rmwvawugvvz4ct","ingredientGroups":[{"items":[{"name":"Rosinen","note":"","qty":225,"qtyMax":null,"unit":"g"},{"name":"Zitronat","note":"klein gehackt","qty":50,"qtyMax":null,"unit":"g"},{"name":"Orangeat","note":"klein gehackt","qty":50,"qtyMax":null,"unit":"g"},{"name":"Rum","note":"","qty":40,"qtyMax":null,"unit":"ml"}],"name":"Am Vortag"},{"items":[{"name":"Hefe","note":"","qty":10,"qtyMax":null,"unit":"g"},{"name":"Milch","note":"lauwarm","qty":90,"qtyMax":null,"unit":"ml"},{"name":"Mehl","note":"","qty":155,"qtyMax":null,"unit":"g"},{"name":"Zucker","note":"","qty":10,"qtyMax":null,"unit":"g"},{"name":"Salz","note":"","qty":3.5,"qtyMax":null,"unit":"g"}],"name":"Für den Hefe-Vorteig"},{"items":[{"name":"Mehl","note":"","qty":140,"qtyMax":null,"unit":"g"},{"name":"Butter","note":"sehr weich","qty":150,"qtyMax":null,"unit":"g"},{"name":"Sauerteig","note":"","qty":30,"qtyMax":null,"unit":"g"},{"name":"Mandeln","note":"gemahlen","qty":50,"qtyMax":null,"unit":"g"},{"name":"Zucker","note":"","qty":25,"qtyMax":null,"unit":"g"},{"name":"Bittermandel-Aroma","note":"","qty":0.25,"qtyMax":null,"unit":"Flasche"},{"name":"Muskatblüte (Macis)","note":"","qty":1,"qtyMax":null,"unit":"g"},{"name":"Vanillezucker","note":"","qty":8,"qtyMax":null,"unit":"g"},{"name":"Zitrone","note":"nur der Abrieb","qty":1,"qtyMax":null,"unit":""}],"name":"Für den Butterteig"},{"items":[{"name":"Butterschmalz","note":"oder geschmolzene Butter","qty":50,"qtyMax":null,"unit":"g"},{"name":"Zucker","note":"","qty":40,"qtyMax":null,"unit":"g"},{"name":"Puderzucker","note":"","qty":50,"qtyMax":null,"unit":"g"}],"name":"Zum Fertigstellen"}],"pan":null,"prepMinutes":null,"restMinutes":210,"servings":1,"servingsUnit":"Stollen","source":"","steps":[{"section":"Am Vortag","text":"Rosinen, klein gehacktes Zitronat und Orangeat in eine Schüssel geben und mit dem Rum tränken. Zugedeckt über Nacht stehen lassen und zwischendurch einmal durchrühren."},{"section":"Hefe-Vorteig","text":"Die Butter aus dem Kühlschrank holen, damit sie Zimmertemperatur annimmt, und alle weiteren Zutaten bereitstellen."},{"section":"Hefe-Vorteig","text":"Die Hefe in der lauwarmen Milch auflösen und kurz durchrühren."},{"section":"Hefe-Vorteig","text":"Mehl, Zucker und Salz in eine Schüssel geben, nach 10 Minuten die aufgelöste Hefe zugeben und alles mit der Küchenmaschine oder den Knethaken sorgfältig verkneten, bis der Teig glänzt und sich vom Schüsselrand löst."},{"section":"Hefe-Vorteig","text":"Den Teig an einem warmen, geschützten Ort zugedeckt 1,5 bis 2 Stunden gehen lassen, bis er sich verdoppelt hat, elastisch ist und eine Fingermulde zurückbleibt."},{"section":"Teig verkneten","text":"In einer großen Schüssel das Mehl für den Butterteig mit der sehr weichen Butter verkneten. Den gegangenen Vorteig und den Sauerteig zugeben und alles miteinander verkneten."},{"section":"Teig verkneten","text":"Gemahlene Mandeln, Zucker, Bittermandel-Aroma, Macis, Vanillezucker und Zitronenabrieb zugeben und gut unterkneten. Ein Drittel des Teiges beiseitestellen."},{"section":"Teig verkneten","text":"In den restlichen Teig zum Schluss die eingeweichten Rosinen mit Zitronat und Orangeat gründlich, aber vorsichtig einarbeiten, bis sie gleichmäßig verteilt sind."},{"section":"Teig verkneten","text":"Den Teig noch 1 Stunde bei Zimmertemperatur zugedeckt gehen lassen und dann 30 Minuten kalt stellen, damit er sich besser verarbeiten lässt."},{"section":"Formen und Backen","text":"Den Backofen auf 220 °C Umluft vorheizen."},{"section":"Formen und Backen","text":"Den Rosinenteig auf der Arbeitsfläche kurz durchkneten und zu einer Rolle formen. Den beiseitegestellten Teig ausrollen und um die Rolle wickeln, die Oberfläche soll schön glatt sein."},{"section":"Formen und Backen","text":"Die Rolle auf ein mit Backpapier ausgelegtes Blech legen und mit einem scharfen Messer einen ½ cm tiefen Längsschnitt machen."},{"section":"Formen und Backen","text":"Das Blech in den Ofen schieben, sofort auf 160 °C Umluft zurückschalten und den Stollen 50 bis 60 Minuten backen."},{"section":"Fertigstellen","text":"Den Stollen auf dem Blech lassen, damit er nicht bricht, und dunkel gewordene Rosinen am Rand entfernen."},{"section":"Fertigstellen","text":"Ringsum mit heißem Butterschmalz bestreichen und mit Zucker bestreuen. Diese Schicht versiegelt ihn, damit er nicht austrocknet."},{"section":"Fertigstellen","text":"Wenn die Zuckerkruste kalt ist, den Stollen sorgfältig in Alufolie wickeln und in einen Frischhaltebeutel oder eine Blechdose geben."},{"section":"Fertigstellen","text":"Vor dem Anschneiden dick mit Puderzucker bestreuen."}],"tags":["Stollen","Weihnachten","Rosinen","Hefeteig","Sauerteig"],"tips":"Ohne Alufolie: den Stollen erst in Backpapier und darüber in eine dicke Lage Zeitungspapier wickeln.\nGut verpackt hält er sich einige Wochen kühl gelagert, z. B. im Keller oder Schlafzimmer.\nEin fertiger Stollen wiegt geschätzt etwa 1,07 kg.","title":"Christstollen","updatedAt":"2026-11-24T23:48:30.795Z"},{"category":"Kuchen & Gebäck","cookMinutes":60,"createdAt":"2026-11-24T23:48:30.795Z","description":"Mandelstollen ohne Rosinen, mit gerösteten Mandeln, Amaretto, Zitronat und Orangeat und auf Wunsch mit Marzipankern.","diet":["vegetarisch"],"difficulty":"anspruchsvoll","example":false,"id":"rmwvcievoq9xwd","ingredientGroups":[{"items":[{"name":"Mandeln","note":"gehackt","qty":150,"qtyMax":null,"unit":"g"},{"name":"Zitronat","note":"klein gehackt","qty":50,"qtyMax":null,"unit":"g"},{"name":"Orangeat","note":"klein gehackt","qty":60,"qtyMax":null,"unit":"g"},{"name":"Rum","note":"","qty":20,"qtyMax":null,"unit":"ml"},{"name":"Amaretto","note":"","qty":20,"qtyMax":null,"unit":"ml"}],"name":"Am Vortag"},{"items":[{"name":"Hefe","note":"","qty":10,"qtyMax":null,"unit":"g"},{"name":"Milch","note":"lauwarm","qty":100,"qtyMax":null,"unit":"ml"},{"name":"Mehl","note":"","qty":155,"qtyMax":null,"unit":"g"},{"name":"Zucker","note":"","qty":10,"qtyMax":null,"unit":"g"},{"name":"Salz","note":"","qty":3.5,"qtyMax":null,"unit":"g"}],"name":"Für den Hefe-Vorteig"},{"items":[{"name":"Mehl","note":"","qty":140,"qtyMax":null,"unit":"g"},{"name":"Butter","note":"sehr weich","qty":150,"qtyMax":null,"unit":"g"},{"name":"Sauerteig","note":"","qty":30,"qtyMax":null,"unit":"g"},{"name":"Mandeln","note":"gemahlen, blanchiert","qty":100,"qtyMax":null,"unit":"g"},{"name":"Zucker","note":"","qty":25,"qtyMax":null,"unit":"g"},{"name":"Bittermandel-Aroma","note":"","qty":0.25,"qtyMax":null,"unit":"Flasche"},{"name":"Muskatblüte (Macis)","note":"","qty":1,"qtyMax":null,"unit":"g"},{"name":"Vanillezucker","note":"","qty":8,"qtyMax":null,"unit":"g"},{"name":"Zitrone","note":"nur der Abrieb","qty":1,"qtyMax":null,"unit":""},{"name":"Kardamom","note":"gemahlen, optional","qty":0.5,"qtyMax":null,"unit":"g"}],"name":"Für den Butterteig"},{"items":[{"name":"Marzipan-Rohmasse","note":"optional","qty":100,"qtyMax":null,"unit":"g"}],"name":"Für den Kern"},{"items":[{"name":"Butterschmalz","note":"","qty":50,"qtyMax":null,"unit":"g"},{"name":"Zucker","note":"","qty":40,"qtyMax":null,"unit":"g"},{"name":"Puderzucker","note":"","qty":50,"qtyMax":null,"unit":"g"}],"name":"Zum Fertigstellen"}],"pan":null,"prepMinutes":null,"restMinutes":210,"servings":1,"servingsUnit":"Stollen","source":"","steps":[{"section":"Am Vortag","text":"Die gehackten Mandeln in einer trockenen Pfanne goldbraun rösten und abkühlen lassen."},{"section":"Am Vortag","text":"Mit klein gehacktem Zitronat und Orangeat in eine Schüssel geben und mit Rum und Amaretto tränken. Zugedeckt über Nacht stehen lassen und zwischendurch einmal durchrühren."},{"section":"Hefe-Vorteig","text":"Butter und Marzipan aus dem Kühlschrank holen, damit sie Zimmertemperatur annehmen, und alle weiteren Zutaten bereitstellen."},{"section":"Hefe-Vorteig","text":"Die Hefe in der lauwarmen Milch auflösen und kurz durchrühren."},{"section":"Hefe-Vorteig","text":"Mehl, Zucker und Salz in eine Schüssel geben, nach 10 Minuten die aufgelöste Hefe zugeben und alles mit der Küchenmaschine oder den Knethaken sorgfältig verkneten, bis der Teig glänzt und sich vom Schüsselrand löst."},{"section":"Hefe-Vorteig","text":"Den Teig an einem warmen, geschützten Ort zugedeckt 1,5 bis 2 Stunden gehen lassen, bis sich das Volumen verdoppelt hat und eine Fingermulde zurückbleibt."},{"section":"Teig verkneten","text":"In einer großen Schüssel das Mehl für den Butterteig mit der sehr weichen Butter verkneten. Den gegangenen Vorteig und den Sauerteig zugeben und alles miteinander verkneten."},{"section":"Teig verkneten","text":"Gemahlene Mandeln, Zucker, Bittermandel-Aroma, Macis, Vanillezucker, Zitronenabrieb und Kardamom unterkneten. Ein Drittel des Teiges beiseitestellen."},{"section":"Teig verkneten","text":"Die eingeweichte Frucht-Mandel-Mischung gut abtropfen lassen und gründlich, aber vorsichtig in den restlichen Teig einarbeiten."},{"section":"Teig verkneten","text":"Den Teig noch 1 Stunde bei Zimmertemperatur zugedeckt gehen lassen und dann 30 Minuten kalt stellen."},{"section":"Formen mit Marzipankern","text":"Den Ofen auf 200 °C Umluft vorheizen."},{"section":"Formen mit Marzipankern","text":"Das Marzipan kurz durchkneten und zu einer Rolle formen, die etwa 5 cm kürzer ist als der spätere Stollen."},{"section":"Formen mit Marzipankern","text":"Den Fruchtteig auf der Arbeitsfläche kurz durchkneten und zu einem Rechteck flach drücken. Die Marzipanrolle mittig auflegen und den Teig darüber zu einer Rolle schlagen. Das Marzipan muss komplett eingeschlossen sein, sonst verbrennt es."},{"section":"Formen mit Marzipankern","text":"Den hellen Teig ausrollen, um die Rolle wickeln und die Oberfläche schön glatt streichen."},{"section":"Formen mit Marzipankern","text":"Auf ein Blech mit Backpapier legen und mit einem scharfen Messer ½ cm tief längs einschneiden."},{"section":"Backen und Fertigstellen","text":"Das Blech in den Ofen schieben, sofort auf 160 °C Umluft zurückschalten und 55 bis 65 Minuten backen. Mandeln und Marzipan bräunen schneller: Wird die Oberfläche nach etwa 30 Minuten zu dunkel, mit Alufolie abdecken. Fertig ist der Stollen bei 92 bis 94 °C Kerntemperatur."},{"section":"Backen und Fertigstellen","text":"Den Stollen auf dem Blech lassen, damit er nicht bricht. Dunkle Mandelstücke am Rand entfernen."},{"section":"Backen und Fertigstellen","text":"Ringsum mit heißem Butterschmalz bestreichen und mit Zucker bestreuen, das versiegelt ihn."},{"section":"Backen und Fertigstellen","text":"Wenn die Zuckerkruste kalt ist, sorgfältig in Alufolie wickeln und in einen Frischhaltebeutel oder eine Blechdose geben."},{"section":"Backen und Fertigstellen","text":"Gut verpackt kühl lagern. Mandelstollen braucht mindestens 2 bis 3 Wochen zum Durchziehen, bis sich Mandel- und Marzipanaroma entfalten."},{"section":"Backen und Fertigstellen","text":"Vor dem Anschneiden dick mit Puderzucker bestreuen."}],"tags":["Stollen","Weihnachten","Mandeln","Marzipan","Amaretto"],"tips":"Ohne Marzipankern das Marzipan weglassen und dafür etwa 40 g mehr gemahlene Mandeln in den Teig geben.\nMit 250 g Mandeln auf 295 g Mehl erfüllt der Stollen die Leitsätze für Mandelstollen (mindestens 20 Teile Mandeln und 30 Teile Butter je 100 Teile Mehl).\nEin fertiger Stollen wiegt geschätzt etwa 1,07 kg.","title":"Mandelstollen","updatedAt":"2026-11-24T23:48:30.795Z"},{"category":"Pasta & Pizza","cookMinutes":null,"createdAt":"2026-11-24T23:55:05.449Z","description":"Neapolitanischer Pizzateig für große 32-cm-Pizzen mit Biga, etwas Sauerteig und 48 Stunden kalter Gare, etwa 335 g je Teigling.","diet":["vegan","vegetarisch","laktosefrei"],"difficulty":"anspruchsvoll","example":false,"id":"rmwvcqve7y6yrv","ingredientGroups":[{"items":[{"name":"Mehl","note":"","qty":387.4,"qtyMax":null,"unit":"g"},{"name":"Wasser","note":"","qty":200.3,"qtyMax":null,"unit":"g"},{"name":"Frischhefe","note":"","qty":2.8,"qtyMax":null,"unit":"g"}],"name":"Biga"},{"items":[{"name":"Biga","note":"die ganze Menge von oben","qty":590.5,"qtyMax":null,"unit":"g"},{"name":"Mehl","note":"","qty":1606.4,"qtyMax":null,"unit":"g"},{"name":"Salz","note":"","qty":61.8,"qtyMax":null,"unit":"g"},{"name":"Sauerteig","note":"","qty":16.1,"qtyMax":null,"unit":"g"},{"name":"Olivenöl","note":"","qty":18.3,"qtyMax":null,"unit":"g"},{"name":"Wasser","note":"","qty":1056.9,"qtyMax":null,"unit":"g"}],"name":"Hauptteig"}],"pan":null,"prepMinutes":null,"restMinutes":3540,"servings":10,"servingsUnit":"Pizzen","source":"","steps":[{"section":"Biga","text":"Mehl, Wasser und Frischhefe für die Biga vermengen."},{"section":"Biga","text":"Die Biga 10 Stunden bei 18 bis 20 °C reifen lassen."},{"section":"Hauptteig","text":"Die reife Biga mit Mehl, Salz, Sauerteig, Olivenöl und Wasser zum Hauptteig verarbeiten."},{"section":"Hauptteig","text":"Den Teig in Ballen von etwa 335 g teilen und 48 Stunden bei 4 bis 5 °C kalt reifen lassen."},{"section":"Vor dem Backen","text":"Die Teiglinge vor dem Backen etwa 1 Stunde abgedeckt temperieren lassen. Zieht sich der Teig beim Ausbreiten stark zurück, 30 bis 60 Minuten länger warten."}],"tags":["Pizzateig","Biga","Neapolitanisch","Kalte Gare","Sauerteig"],"tips":"Die Hefe ist für 48 Stunden Kühlschrankgare auf 75 % reduziert. Das ist ein Startwert für 18 bis 20 °C bei der Biga und 4 bis 5 °C im Kühlschrank.\nFür die Fassung ohne Reduktion (hochgerechnet vom 28-cm-Rezept) kommen 3,7 g Frischhefe auf 10 Ballen.\nTeig mit etwa 63 % Wasser und 3,1 % Salz, jeweils bezogen auf das gesamte Mehl.","title":"Pizzateig für 32-cm-Pizzen (Biga, 48 h)","updatedAt":"2026-11-24T23:55:05.449Z"},{"category":"Pasta & Pizza","cookMinutes":null,"createdAt":"2026-11-24T23:58:07.144Z","description":"Direkter Pizzateig mit 62 % Wasser für 4 Ballen à 265 g, 2 Stunden bei Raumtemperatur und 22 Stunden im Kühlschrank.","diet":["vegan","vegetarisch","laktosefrei"],"difficulty":"mittel","example":false,"id":"rmwvcurl9dhjpz","ingredientGroups":[{"items":[{"name":"Mehl","note":"","qty":645,"qtyMax":null,"unit":"g"},{"name":"Wasser","note":"","qty":400,"qtyMax":null,"unit":"g"},{"name":"Frischhefe","note":"","qty":3.31,"qtyMax":null,"unit":"g"},{"name":"Salz","note":"","qty":20,"qtyMax":null,"unit":"g"},{"name":"Olivenöl","note":"","qty":12,"qtyMax":null,"unit":"g"}],"name":""}],"pan":null,"prepMinutes":null,"restMinutes":1440,"servings":4,"servingsUnit":"Pizzen","source":"Teigrechner","steps":[{"section":"Teig ansetzen","text":"Wasser und Mehl grob mischen, bis alles zusammenkommt und keine Mehlnester mehr da sind."},{"section":"Teig ansetzen","text":"15 Minuten abgedeckt ruhen lassen."},{"section":"Teig ansetzen","text":"Die Frischhefe in den Teig einarbeiten und noch einmal grob kneten, danach bei Bedarf 15 Minuten ruhen lassen."},{"section":"Teig ansetzen","text":"Den Teig kurz ankneten, dann das Salz und anschließend das Öl einarbeiten."},{"section":"Teig ansetzen","text":"So lange kneten, bis sich das Salz vollständig gelöst hat und der Teig glatter wird. Danach zu einer großen Kugel schleifen."},{"section":"Teig ansetzen","text":"15 Minuten abgedeckt ruhen lassen."},{"section":"Teig ansetzen","text":"Den Teig einmal rundum dehnen und falten."},{"section":"Teig ansetzen","text":"15 Minuten ruhen lassen. Vom Ansetzen bis hier vergehen insgesamt etwa 2 Stunden bei Raumtemperatur (ca. 23 °C)."},{"section":"Portionieren und kalte Gare","text":"In 4 Teiglinge à 265 g portionieren und rund schleifen."},{"section":"Portionieren und kalte Gare","text":"Die Teigballen abgedeckt in Boxen 22 Stunden bei 6 °C kalt gehen lassen."},{"section":"Backtag","text":"Etwa 1 bis 2 Stunden vor dem Backen aus dem Kühlschrank nehmen, bei Bedarf auch länger, bis der Teig weich und dehnbar ist."}],"tags":["Pizzateig","Direkter Teig","Kalte Gare","Teigrechner"],"tips":"Statt Frischhefe geht Trockenhefe: ein Drittel der Menge.\nDie Hefemenge gilt für 2 Stunden bei 23 °C und 22 Stunden bei 6 °C. Für andere Zeiten, Temperaturen oder große Teige rechnet der Teigrechner die Hefe genauer: https://ms29rryj5h-coder.github.io/Teigrechner/#ohne-vorteig\nBei über 7 °C im Kühlschrank reagiert der Teig empfindlich. Die Boxen am besten hinten unten in den Kühlschrank stellen, dort ist es meist am kältesten.","title":"Pizzateig einfach (24 h)","updatedAt":"2026-11-24T23:58:07.144Z"},{"category":"Pasta & Pizza","cookMinutes":null,"createdAt":"2026-11-24T23:58:07.144Z","description":"Pizzateig mit Poolish für mehr Aroma, 4 Ballen à 265 g: 8 Stunden Poolish, dann 2 Stunden bei Raumtemperatur und 22 Stunden im Kühlschrank.","diet":["vegan","vegetarisch","laktosefrei"],"difficulty":"mittel","example":false,"id":"rmwvcurlbnmy1n","ingredientGroups":[{"items":[{"name":"Mehl","note":"","qty":400,"qtyMax":null,"unit":"g"},{"name":"Wasser","note":"","qty":400,"qtyMax":null,"unit":"g"},{"name":"Frischhefe","note":"","qty":2.16,"qtyMax":null,"unit":"g"}],"name":"Poolish"},{"items":[{"name":"Mehl","note":"das restliche Mehl","qty":245,"qtyMax":null,"unit":"g"},{"name":"Salz","note":"","qty":20,"qtyMax":null,"unit":"g"},{"name":"Olivenöl","note":"","qty":12,"qtyMax":null,"unit":"g"}],"name":"Hauptteig"}],"pan":null,"prepMinutes":null,"restMinutes":1920,"servings":4,"servingsUnit":"Pizzen","source":"Teigrechner","steps":[{"section":"Poolish","text":"Poolish-Mehl und -Wasser (1:1) mischen, die Frischhefe einrühren und nur kurz verrühren, bis keine Mehlnester mehr da sind."},{"section":"Poolish","text":"Abgedeckt 8 Stunden bei Raumtemperatur reifen lassen, bis der Poolish sichtbar aktiv und blubbrig ist."},{"section":"Hauptteig","text":"Das restliche Mehl zum Poolish geben und grob mischen, bis alles zusammenkommt."},{"section":"Hauptteig","text":"15 Minuten abgedeckt ruhen lassen."},{"section":"Hauptteig","text":"Den Teig kurz ankneten, dann das Salz und anschließend das Öl einarbeiten."},{"section":"Hauptteig","text":"So lange kneten, bis sich das Salz vollständig gelöst hat und der Teig glatter wird. Danach zu einer großen Kugel schleifen."},{"section":"Hauptteig","text":"15 Minuten abgedeckt ruhen lassen."},{"section":"Hauptteig","text":"Den Teig einmal rundum dehnen und falten."},{"section":"Hauptteig","text":"15 Minuten ruhen lassen. Vom Ansetzen des Hauptteigs bis hier vergehen insgesamt etwa 2 Stunden bei Raumtemperatur (ca. 23 °C)."},{"section":"Portionieren und kalte Gare","text":"In 4 Teiglinge à 265 g portionieren und rund schleifen."},{"section":"Portionieren und kalte Gare","text":"Die Teigballen abgedeckt in Boxen 22 Stunden bei 6 °C kalt gehen lassen."},{"section":"Backtag","text":"Etwa 1 bis 2 Stunden vor dem Backen aus dem Kühlschrank nehmen, bei Bedarf auch länger, bis der Teig weich und dehnbar ist."}],"tags":["Pizzateig","Poolish","Vorteig","Kalte Gare","Teigrechner"],"tips":"Der Poolish ist fertig, wenn er voller Blasen ist und in der Mitte leicht einsinkt.\nStatt Frischhefe geht Trockenhefe: ein Drittel der Menge.\nDie Hefemenge gilt für 8 Stunden Poolish, 2 Stunden bei 23 °C und 22 Stunden bei 6 °C. Für andere Zeiten, Temperaturen oder große Teige rechnet der Teigrechner die Hefe genauer: https://ms29rryj5h-coder.github.io/Teigrechner/#poolish\nBei über 7 °C im Kühlschrank reagiert der Teig empfindlich. Die Boxen am besten hinten unten in den Kühlschrank stellen, dort ist es meist am kältesten.","title":"Pizzateig mit Poolish (24 h)","updatedAt":"2026-11-24T23:58:07.144Z"},{"category":"Salate","co /* Olivenzweig als Schattenform: Stiel als Bogen, schmale Blätter paarweise gegenständig (wie beim Olivenbaum) */
function branchSvg(seed) {
  let z = seed; const rnd = () => (z = (z * 9301 + 49297) % 233280) / 233280;
  const pt = (t) => [(1 - t) * (1 - t) * 24 + 2 * (1 - t) * t * 150 + t * t * 370, (1 - t) * (1 - t) * 376 + 2 * (1 - t) * t * 170 + t * t * 36];
  const leaves = [];
  for (let i = 1; i <= 10; i++) {
    const t = i / 11.2, [x, y] = pt(t), [x2, y2] = pt(t + .01), a = Math.atan2(y2 - y, x2 - x) * 180 / Math.PI;
    for (const side of [-1, 1]) {
      const len = 46 - t * 14 + rnd() * 10, w = 5 + rnd() * 1.6, ang = a + side * (34 + rnd() * 16);
      leaves.push(`<ellipse cx="${(len / 2).toFixed(1)}" cy="0" rx="${(len / 2).toFixed(1)}" ry="${w.toFixed(1)}" transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${ang.toFixed(1)})"/>`);
    }
  }
  const [tx, ty] = pt(1);
  leaves.push(`<ellipse cx="18" cy="0" rx="18" ry="4.6" transform="translate(${tx} ${ty}) rotate(-38)"/>`);
  return `<svg viewBox="0 0 400 400"><path d="M24 376 Q150 170 370 36" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><g fill="currentColor">${leaves.join("")}</g></svg>`;
}

  const h = currentRoute();
  const view = h === "kueche" || h === "neu" || h.startsWith("bearbeiten-") ? "kitchen" : h.startsWith("rezept-") || h.startsWith("entwurf-") ? "recipe" : "book";

  renderHeader();
  const main = $("#main");

  else if (h === "neu" || h.startsWith("bearbeiten-")) renderEditRoute(h);
  else if (h.startsWith("entwurf-")) renderDraft(h.slice(8));

function defaultCalc(r) {
  const first = (r.ingredientGroups || []).flatMap((g) => g.items || []).findIndex((i) => i.qty);
  const pan = r.pan && r.pan.shape ? { ...r.pan } : { shape: "rund", diameter: 26 };
  return { id: r.id, mode: "portionen", servings: +r.servings || 1, ingIdx: Math.max(0, first), ingAmount: "", panFrom: pan, panTo: { ...pan }, doneIng: new Set(), doneStep: new Set() };

function calcFactor(r, c) {

  if (c.mode === "zutat") { const it = (r.ingredientGroups || []).flatMap((g) => g.items || [])[c.ingIdx]; const a = numVal(c.ingAmount || ""); return it && it.qty && a > 0 ? a / it.qty : 1; }

}
function renderIngredients(r) {
  const c = S.calc, f = calcFactor(r, c); let k = 0; const scaled = Math.abs(f - 1) > 1e-6;
  const html = (r.ingredientGroups || []).map((g) => `${g.name ? `<h3>${esc(g.name)}</h3>` : ""}<ul>${(g.items || []).map((it) => {
    const i = k++; const q = fmtQty(it, f);
    const d = c.doneIng.has(i);
    return `<li class="ing${d ? " done" : ""}" data-i="${i}" role="checkbox" tabindex="0" aria-checked="${d}"><span class="q${scaled && q.text ? " scaled" : ""}">${esc(q.text)}${q.unit ? " " + esc(q.unit) : ""}</span><span>${esc(it.name)}${it.note ? ` <small>${esc(it.note)}</small>` : ""}</span></li>`;
  }).join("")}</ul>`).join("");
  $("#ingList").innerHTML = html || `<p class="muted">Keine Zutaten erfasst.</p>`;

function buildPage(pub) {
  const css = document.getElementById("kk-css").textContent;
  const app = document.getElementById("kk-app").textContent;
  const data = JSON.stringify(pub).replace(/</g, "\\u003c");
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + RESET + '</style></head><body>'
    + '<title>Küchenkartei</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n<link rel="stylesheet" href="' + FONT_HREF + '">\n'
    + '<style id="kk-css">' + css + '</style>\n<div id="app"></div>\n'
    + '<script type="application/json" id="kk-data">' + data + '<\/script>\n'
    + '<script id="kk-app">' + app + '<\/script>\n</body></html>';
}
async function makeThumb(src, max = 1100) {
  const img = new Image(); img.src = src;
  await img.decode();
  const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const cv = document.createElement("canvas"); cv.width = Math.round(img.naturalWidth * s); cv.height = Math.round(img.naturalHeight * s);
  cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
  return cv.toDataURL("image/jpeg", .74);
}
async function toPublic(r) {
  const p = structuredClone(r);
  delete p.coverId; delete p.originalIds; delete p.favorite; delete p.coverThumb;
  if (r.coverId) { try { p.coverThumb = await makeThumb(blobUrl(r.coverId)); } catch {} }
  else if (r.coverThumb) p.coverThumb = r.coverThumb;
  return p;
}
function pubMsg(html) { const el = $("#pubMsg"); if (el) el.innerHTML = html; }
async function publishSite(mutate, doneMsg, returnHash) {
  if (S.busyPublish) return;
  if (!S.art) { pubMsg(`<div class="note err">Veröffentlichen ist in dieser Ansicht nicht möglich.</div>`); return; }
  S.busyPublish = true;
  pubMsg(`<div class="note pending"><div class="spinner"></div><span>Kochbuch wird veröffentlicht …</span></div>`);
  try {
    const next = structuredClone(PUB);
    await mutate(next);
    next.publishedAt = new Date().toISOString();
    const html = buildPage(next);
    if (new Blob([html]).size > MAX_PAGE_BYTES) throw { code: "too_large" };
    ssSet("kk-return", { hash: returnHash ?? location.hash, msg: doneMsg });
    await S.art.publish(html);
  } catch (e) {
    S.busyPublish = false;
    try { sessionStorage.removeItem("kk-return"); } catch {}
    const m = {
      conflict: "Gerade wurde eine neuere Fassung veröffentlicht. Die Seite lädt neu, bitte danach noch einmal versuchen.",
      not_writer: "Nur Personen mit Bearbeitungsrecht können veröffentlichen.", not_granted: "Nur Personen mit Bearbeitungsrecht können veröffentlichen.",
      too_large: "Das Kochbuch wäre zu groß. Nimm alte Rezepte heraus oder lass bei einigen das Titelbild weg.",
      rate_limited: "Zu viele Veröffentlichungen kurz hintereinander. Bitte in einer Minute noch einmal."
    };
    pubMsg(`<div class="note err">${esc(m[e?.code] || "Veröffentlichen hat nicht geklappt. Bitte noch einmal versuchen.")}</div>`);
  }
}
function publishRecipes(ids, overrides = {}, returnHash) {
  const recs = ids.map((id) => overrides[id] || S.dbRecipes.get(id)).filter(Boolean);
  if (!recs.length) return;
  return publishSite(async (p) => {
    for (const r of recs) {
      const pr = await toPublic(r);
      p.recipes = p.recipes.filter((x) => x.id !== r.id).concat(pr);
    }
  }, recs.length === 1 ? `„${recs[0].title}“ steht jetzt im Kochbuch` : `${recs.length} Rezepte veröffentlicht`, returnHash);
}
function unpublishRecipe(id) {
  const r = pubById.get(id);
  return publishSite((p) => { p.recipes = p.recipes.filter((x) => x.id !== id); }, `„${r?.title || "Rezept"}“ aus dem Kochbuch genommen`);
}

async function toJpeg(file, max = 2000) {
  const bmp = await createImageBitmap(file).catch(() => null);
  if (!bmp) throw new Error("Das Bild „" + file.name + "“ kann der Browser nicht lesen. Bitte als JPG oder PNG speichern.");
  const s = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const cv = document.createElement("canvas"); cv.width = Math.round(bmp.width * s); cv.height = Math.round(bmp.height * s);
  cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);
  return await new Promise((res) => cv.toBlob(res, "image/jpeg", .86));
}
async function addFiles(files) {

    try { const b = await toJpeg(f); E.photos.push({ kind: "new", blob: b, url: URL.createObjectURL(b), keep: true }); } catch (e) { E.err = e.message; }

  renderEdit();

async function saveRecipe(andPublish) {

  if (!d.title) { E.err = "Bitte einen Titel eingeben."; renderEdit(); return; }

  E.busy = true; E.err = ""; renderEdit();

    const before = new Set([old?.coverId, ...(old?.originalIds || [])].filter(Boolean));

      if (p.kind === "new") { if (!S.assets) continue; const res = await S.assets.upload(p.blob, { type: "image/jpeg" }); Object.assign(p, { kind: "asset", id: res.id }); }

    for (const k of Object.keys(rec)) if (rec[k] === undefined) delete rec[k];
    await S.db.doc("recipes/" + id).set(rec);
    const after = new Set([coverId, ...originalIds].filter(Boolean));
    if (S.assets) for (const a of before) if (!after.has(a)) { try { await S.assets.delete(a); } catch {} }
    S.dbRecipes.set(id, rec); S.calc = null;
    if (andPublish) {
      E.busy = false; E.recipeId = id;
      await publishRecipes([id], { [id]: rec }, "#entwurf-" + id);
      if (!S.busyPublish) { S.edit = null; location.hash = "entwurf-" + id; toast("Gespeichert, aber nicht veröffentlicht. Bitte noch einmal versuchen."); }
      return;
    }
    S.edit = null; toast("Gespeichert. Noch nicht im Kochbuch."); location.hash = "entwurf-" + id;
  } catch (e) {
    E.busy = false;
    E.err = e?.code === "quota_exceeded" || e?.code === "quota_or_state" ? "Der Speicher ist voll. Lösche alte Rezepte oder Fotos und versuche es erneut."
      : e?.code === "too_large" ? "Ein Foto ist zu groß." : "Speichern fehlgeschlagen. Bitte noch einmal versuchen.";
    renderEdit();
  }
}

/* ================= Claude: Vorlage aufbereiten ================= */
function buildPrompt(text, nImages) {
  return `Du bist die Rezeptredaktion eines privaten, deutschsprachigen Kochbuchs. Wandle die folgende Vorlage in genau EIN Rezept im einheitlichen Format um.
${nImages ? `Es sind ${nImages} Foto(s) angehängt (Nummern 0 bis ${nImages - 1} in der Reihenfolge). Sie können Kochbuchseiten, handschriftliche Zettel, Screenshots oder ein Foto des fertigen Gerichts zeigen. Lies Text auf den Fotos sorgfältig, auch Handschrift.` : ""}
${text.trim() ? `\nVORLAGE (Text):\n"""\n${text.trim().slice(0, 30000)}\n"""\n` : ""}
REGELN
- Alles auf Deutsch. Fremdsprachige Rezepte übersetzen. Zutatennamen in deutscher Küchensprache (z. B. "Weizenmehl Type 405", "Schmand").
- Einheiten metrisch und einheitlich: g, kg, ml, l, EL, TL, Msp., Prise, Stück, Zehe, Bund, Dose, Pck., Scheibe, Blatt, Becher, Zweig, Stange, Glas, Handvoll, Spritzer, cm. Cups, oz, lb, fl oz, °F umrechnen (1 cup Mehl ≈ 125 g, Zucker ≈ 200 g, Flüssigkeit 240 ml, Butter ≈ 225 g; 1 oz = 28 g; 1 lb = 454 g; °F in °C). Bei Umrechnung den Originalwert in "note" vermerken, z. B. "urspr. 1 cup".
- Zählbare Zutaten ohne Einheit: unit "" (z. B. 3 Eier → qty 3, unit "", name "Eier").
- qty als Zahl (0.5 statt "½"), Spannen als qty + qtyMax. Ohne Menge ("Salz nach Geschmack"): qty null, Hinweis in note.
- Name kurz, Zubereitungshinweise ("gewürfelt", "zimmerwarm") in note.
- Zutaten nach Abschnitten gruppieren, wenn die Vorlage welche hat (z. B. "Für den Teig"), sonst eine Gruppe mit name "".
- Schritte: klare, vollständige Sätze im Imperativ, ein Arbeitsgang pro Schritt, Temperaturen und Zeiten drin lassen (z. B. "bei 180 °C Ober-/Unterhitze 35 Minuten backen"). Abschnittstitel in "section", sonst "".
- Nichts erfinden. Fehlende Angaben null bzw. "". Unklares oder Unleserliches in "warnings" kurz benennen.
- category: genau eine aus ${JSON.stringify(CATEGORIES)}.
- diet: zutreffende aus ${JSON.stringify(DIETS)} (nur wenn sicher).
- tags: 2 bis 6 kurze, nützliche Schlagwörter auf Deutsch (Hauptzutat, Küche/Land, Anlass, Garmethode), ohne Kategorie und Ernährungsform zu wiederholen.
- servings: Zahl, für die das Rezept geschrieben ist; servingsUnit: "Portionen", "Stück", "Kuchen", "Blech", "Gläser", "Brote" oder "Pizzen".
- difficulty: "einfach", "mittel" oder "anspruchsvoll" nach deiner Einschätzung.
- pan: nur bei Backform/Blech/Auflaufform mit Größenangabe; rund {"shape":"rund","diameter":26}, eckig {"shape":"eckig","width":30,"length":40}; sonst null.
- coverImageIndex: Nummer des Fotos, das das fertige Gericht zeigt, sonst null.
- source: Buchtitel/Website/Person, wenn erkennbar, sonst "".
- tips: Tipps, Varianten, Aufbewahrung aus der Vorlage als kurzer Text, sonst "".

Antworte NUR mit einem JSON-Objekt in genau dieser Form:
{"title":"","description":"","category":"","tags":[],"diet":[],"servings":4,"servingsUnit":"Portionen","prepMinutes":null,"cookMinutes":null,"restMinutes":null,"difficulty":"einfach","pan":null,"ingredientGroups":[{"name":"","items":[{"qty":200,"qtyMax":null,"unit":"g","name":"Weizenmehl Type 405","note":""}]}],"steps":[{"text":"","section":""}],"tips":"","source":"","coverImageIndex":null,"warnings":[]}`;
}
function normalizeParsed(o) {
  const d = emptyRecipe();
  const str = (v) => (typeof v === "string" ? v.trim() : "");
  const num = (v) => { const n = typeof v === "number" ? v : numVal(v ?? ""); return isFinite(n) && n > 0 ? n : null; };
  d.title = str(o.title) || "Neues Rezept"; d.description = str(o.description);
  d.category = CATEGORIES.includes(o.category) ? o.category : "Hauptgerichte";
  d.tags = Array.isArray(o.tags) ? o.tags.map(str).filter(Boolean).slice(0, 8) : [];
  d.diet = Array.isArray(o.diet) ? o.diet.filter((x) => DIETS.includes(x)) : [];
  d.servings = num(o.servings) ?? 4; d.servingsUnit = str(o.servingsUnit) || "Portionen";
  d.prepMinutes = num(o.prepMinutes); d.cookMinutes = num(o.cookMinutes); d.restMinutes = num(o.restMinutes);
  d.difficulty = DIFFS.includes(o.difficulty) ? o.difficulty : "mittel";
  const p = o.pan;
  d.pan = p && p.shape === "rund" && num(p.diameter) ? { shape: "rund", diameter: num(p.diameter) } : p && p.shape === "eckig" && num(p.width) && num(p.length) ? { shape: "eckig", width: num(p.width), length: num(p.length) } : null;
  d.ingredientGroups = (Array.isArray(o.ingredientGroups) ? o.ingredientGroups : []).map((g) => ({
    name: str(g?.name),
    items: (Array.isArray(g?.items) ? g.items : []).map((it) => { const k = str(it?.unit).toLowerCase().replace(/\.$/, ""); return { qty: num(it?.qty), qtyMax: num(it?.qtyMax), unit: UNIT_ALIASES[k] || str(it?.unit), name: str(it?.name), note: str(it?.note) }; }).filter((it) => it.name)
  })).filter((g) => g.items.length);
  d.steps = (Array.isArray(o.steps) ? o.steps : []).map((s) => typeof s === "string" ? { text: s.trim(), section: "" } : { text: str(s?.text), section: str(s?.section) }).filter((s) => s.text);
  d.tips = str(o.tips); d.source = str(o.source);
  return { d, cover: Number.isInteger(o.coverImageIndex) ? o.coverImageIndex : null, warnings: Array.isArray(o.warnings) ? o.warnings.map(str).filter(Boolean) : [] };
}
async function runImport() {
  const E = S.edit; E.err = "";
  if (!E.srcText.trim() && !E.photos.length) { E.err = "Füge zuerst Text ein oder lade ein Foto hoch."; renderEdit(); return; }
  const imgs = E.photos.filter((p) => p.kind === "new").map((p) => p.blob);
  if (imgs.length) {
    const lim = await S.sample.limits().catch(() => null);
    if (!lim?.images) { E.err = "Fotos können in dieser Ansicht nicht an Claude geschickt werden. Bitte den Text einfügen."; renderEdit(); return; }
    if (imgs.length > lim.images.maxCount) { E.err = `Bitte höchstens ${lim.images.maxCount} Fotos auf einmal.`; renderEdit(); return; }
  }
  E.busy = true; renderEdit();
  S.importCtl = new AbortController();
  try {
    const out = await S.sample.json(buildPrompt(E.srcText, imgs.length), {
      signal: S.importCtl.signal, ...(imgs.length ? { images: imgs } : {}),
      onText: () => { const t = $("#liveTxt"); if (t) t.textContent = "Claude schreibt das Rezept …"; }
    });
    const { d, cover, warnings } = normalizeParsed(out || {});
    E.data = d; E.warnings = warnings; E.fromClaude = true;
    const newPhotos = E.photos.filter((p) => p.kind === "new");
    E.cover = cover != null && cover >= 0 && cover < newPhotos.length ? E.photos.indexOf(newPhotos[cover]) : -1;
    E.photos.forEach((p, i) => { p.keep = i !== E.cover; });
    E.busy = false; E.step = 2; renderEdit();
  } catch (e) {
    E.busy = false;
    const map = {
      cancelled: "", not_granted: "Du hast die Nutzung von Claude für diese Seite nicht erlaubt. Du kannst das Rezept von Hand eintragen.",
      rate_limited: "Gerade zu viele Anfragen. Bitte in ein paar Minuten noch einmal versuchen.",
      image_rejected: "Ein Foto wurde nicht angenommen (Format oder Größe). Bitte ein anderes Foto verwenden.",
      invalid_json: "Die Antwort war nicht im erwarteten Format. Bitte noch einmal versuchen.",
      refused: "Claude konnte diese Vorlage nicht verarbeiten.", prompt_too_large: "Der Text ist zu lang. Bitte nur das eine Rezept einfügen.",
      session_expired: "Bitte neu bei Claude anmelden."
    };
    E.err = map[e?.code] ?? "Das Aufbereiten hat nicht geklappt. Bitte noch einmal versuchen.";
    if (e?.code === "not_granted" || e?.code === "sampling_disabled") S.sample = null;
    renderEdit();
  }
}
document.addEventListener("paste", (e) => {
  if (!S.edit || S.edit.step !== 1 || !$("#drop")) return;
  const files = [...(e.clipboardData?.files || [])].filter((f) => f.type.startsWith("image/"));
  if (files.length) { e.preventDefault(); S.edit.srcText = $("#srcText")?.value ?? S.edit.srcText; addFiles(files); }
});

const GH_URL = "https://ms29rryj5h-coder.github.io/kuechenkartei/";
const GH_UPLOAD = "https://github.com/ms29rryj5h-coder/kuechenkartei/upload/main";
function ghStale() { try { return localStorage.getItem("kk-gh-export") !== PUB.publishedAt; } catch { return false; } }
async function exportGithub() {
  const msg = $("#ghMsg");
  if (!S.downloads) { msg.textContent = "Download ist in dieser Ansicht nicht verfügbar."; return; }

    await S.downloads.save({ filename: "index.html", data: buildPage(PUB) });

    $("#ghNote")?.remove();

      : (e?.code === "rejected_extension" || e?.code === "extension_not_enabled") ? "HTML-Dateien lassen sich in dieser Ansicht nicht herunterladen."
      : "Download fehlgeschlagen.";
  }
}
async function exportJson() {
  const msg = $("#footMsg");
  const data = JSON.stringify({ app: "Küchenkartei", exportedAt: new Date().toISOString(), site: PUB.site, recipes: [...S.dbRecipes.values()] }, null, 2);
  if (!S.downloads) { msg.textContent = "Export ist in dieser Ansicht nicht verfügbar."; return; }
  try { await S.downloads.save({ filename: `kuechenkartei-${new Date().toISOString().slice(0, 10)}.json`, data }); msg.textContent = "Export übergeben."; }
  catch (e) { msg.textContent = e?.code === "declined" ? "Export abgebrochen." : "Export fehlgeschlagen."; }
}
async function importJson(file) {
  const msg = $("#footMsg"); if (!file || !S.db) return;
  try {
    const obj = JSON.parse(await file.text());
    const list = Array.isArray(obj) ? obj : obj.recipes;
    if (!Array.isArray(list)) throw new Error("Keine Rezeptliste in der Datei.");
    let n = 0;
    for (const r of list) {
      if (!r || !r.title) continue;
      const id = r.id && /^[A-Za-z0-9_-]+$/.test(r.id) ? r.id : newId();
      await S.db.doc("recipes/" + id).set({ ...r, id }); n++;
    }
    msg.textContent = `${n} Rezepte in die Küche importiert. Veröffentlichen nicht vergessen.`;
  } catch (e) { msg.textContent = "Import fehlgeschlagen: " + (e.message || e.code || "Datei nicht lesbar"); }
}

function rerenderKitchenViews() {
  const h = currentRoute();
  renderHeader();
  if (h === "kueche") renderKitchen();
  else if (h.startsWith("entwurf-")) renderDraft(h.slice(8));
  else if ((h === "neu" || h.startsWith("bearbeiten-")) && !S.edit) renderEditRoute(h);
  else if (h.startsWith("rezept-") && !pubById.has(h.slice(7))) renderPublicRecipe(h.slice(7));
}
renderShell();
(() => {
  const back = ssTake("kk-return");
  if (back) {
    if (back.hash && back.hash !== location.hash) { try { history.replaceState(null, "", back.hash); } catch { location.hash = back.hash; } }
    if (back.msg) setTimeout(() => toast(back.msg), 300);
  }
})();
route();
(async () => {
  const cl = window.claude;
  if (!cl || !cl.use) { S.capsReady = true; rerenderKitchenViews(); return; }
  const user = await cl.use("user").catch(() => null);
  if (user) { try { S.canEdit = !!(await user.canEdit()); } catch {} }
  if (!S.canEdit) { S.capsReady = true; rerenderKitchenViews(); return; }
  const [db, sample, assets, downloads, art] = await Promise.all(["db", "sample", "assets", "downloads", "artifact"].map((n) => cl.use(n).catch(() => null)));
  Object.assign(S, { db, sample, assets, downloads, art, capsReady: true });
  if (!db) { S.dbErr = "Die Küche ist in dieser Ansicht nicht erreichbar."; rerenderKitchenViews(); return; }
  const timer = setTimeout(() => { if (!S.dbLoaded) { S.dbErr = "Die Rezepte lassen sich gerade nicht laden. Bitte später erneut öffnen."; rerenderKitchenViews(); } }, 10000);
  db.collection("recipes").limit(1000).onSnapshot((snap) => {
    const m = new Map(); for (const d of snap.docs) { const r = d.data(); if (r) m.set(d.id, { ...r, id: d.id }); }
    S.dbRecipes = m;
    if (!snap.metadata.fromCache) { S.dbLoaded = true; S.dbErr = ""; clearTimeout(timer); } else if (m.size) S.dbLoaded = true;
    const h = currentRoute();
    if (h.startsWith("bearbeiten-") && S.edit) return;
    if (h === "neu" && S.edit) { renderHeader(); return; }
    rerenderKitchenViews();
  }, (e) => { clearTimeout(timer); S.dbErr = "Die Rezepte konnten nicht geladen werden (" + e.code + ")."; rerenderKitchenViews(); });
  rerenderKitchenViews();
})();
